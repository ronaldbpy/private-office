          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group" style="margin-bottom:0;">' +
              '<label for="targetFat">Grasa (g)</label>' +
              '<input type="number" id="targetFat" inputmode="decimal" min="0" step="1" value="' + n(t.fat) + '" required>' +
            '</div>' +
            '<div class="form-group" style="margin-bottom:0;">' +
              '<label for="targetCalories">Calorías (kcal)</label>' +
              '<input type="number" id="targetCalories" inputmode="decimal" min="0" step="1" value="' + n(t.calories) + '" required>' +
            '</div>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="submit" class="btn block">Guardar objetivos</button>' +
          '</div>' +
        '</form>' +
      '</div>' +

    '<div class="card mb-4">' +
        '<div class="card-header"><h3>Datos</h3></div>' +
        '<div class="flex flex-col gap-2">' +
          '<button type="button" class="btn secondary block" data-action="export-data">Exportar JSON</button>' +
          '<button type="button" class="btn secondary block" data-action="trigger-import">Importar JSON</button>' +
          '<input type="file" id="importFile" accept="application/json,.json" class="hidden">' +
          '<button type="button" class="btn danger block" data-action="reset-data">Restablecer datos</button>' +
        '</div>' +
      '</div>' +

    '<p id="settingsStatus" class="text-sm muted mt-2" aria-live="polite"></p>'
  );
}

// phaseSelector() → HTML string for the phase-selection modal (overlay +
// panel), one clickable card per PROTOCOLS entry (Anabolismo, Retatrutida,
// Purga). Appended to document.body (outside #root) by openPhaseSelector(),
// mirroring mealBuilderModal()/peptideModal()'s pattern from Tasks 4/5:
// modals live outside #root so a render() elsewhere can't wipe them
// mid-interaction, so their controls use inline onclick rather than
// #root's data-action delegation.
function phaseSelector() {
  const cards = Object.keys(PROTOCOLS).map(function (key) {
    const p = PROTOCOLS[key];
    const isActive = state.selectedPhase === key;
    return '' +
      '<button type="button" class="card phase-card' + (isActive ? ' active' : '') + '" onclick="setPhase(\'' + esc(key) + '\')">' +
        '<div class="card-header">' +
          '<h3>' + esc(key) + '</h3>' +
          (isActive ? '<span class="badge primary">Actual</span>' : '') +
        '</div>' +
        '<p class="muted text-sm mb-3">' + esc(p.description) + '</p>' +
        '<div class="macro-preview">' +
          '<div><div class="macro-value">' + n(p.targets.protein) + 'g</div><div class="macro-label">Prot</div></div>' +
          '<div><div class="macro-value">' + n(p.targets.carbs) + 'g</div><div class="macro-label">Carb</div></div>' +
          '<div><div class="macro-value">' + n(p.targets.fat) + 'g</div><div class="macro-label">Grasa</div></div>' +
          '<div><div class="macro-value">' + n(p.targets.calories) + '</div><div class="macro-label">Kcal</div></div>' +
        '</div>' +
      '</button>';
  }).join('');

  return '' +
    '<div class="modal-overlay" id="phaseModalOverlay" onclick="if(event.target===this) closePhaseSelector()">' +
      '<div class="modal active" id="phaseModal" role="dialog" aria-modal="true" aria-labelledby="phaseModalTitle">' +
        '<div class="modal-header">' +
          '<h2 id="phaseModalTitle">Seleccionar fase</h2>' +
          '<button type="button" class="modal-close" onclick="closePhaseSelector()" aria-label="Cerrar">&times;</button>' +
        '</div>' +
        '<div class="modal-body">' + cards + '</div>' +
      '</div>' +
    '</div>';
}

// openPhaseSelector() → inserts phaseSelector() into the DOM. Called from
// showSettings()'s "Cambiar fase" button via data-action delegation.
function openPhaseSelector() {
  closePhaseSelector(); // remove any stale instance first
  document.body.insertAdjacentHTML('beforeend', phaseSelector());
}

// closePhaseSelector() → removes the phase modal overlay from the DOM, if present.
function closePhaseSelector() {
  const overlay = document.getElementById('phaseModalOverlay');
  if (overlay) overlay.remove();
}

// setPhase(phaseId) → switches state.selectedPhase and re-derives
// state.macroTargets from PROTOCOLS[phaseId]'s defaults, persists, closes
// the phase modal, and re-renders (updates the header subtitle too).
function setPhase(phaseId) {
  if (!PROTOCOLS[phaseId]) return;
  state.selectedPhase = phaseId;
  state.macroTargets = Object.assign({}, PROTOCOLS[phaseId].targets);
  save();
  closePhaseSelector();
  render();
}

// handleTargetSubmit(e) → reads the four macro-target inputs, writes them
// to state.macroTargets (decoupled from the selected phase's defaults — the
// user can hand-tune targets without switching phase), persists, re-renders.
function handleTargetSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();
  const protein = n(document.getElementById('targetProtein').value);
  const carbs = n(document.getElementById('targetCarbs').value);
  const fat = n(document.getElementById('targetFat').value);
  const calories = n(document.getElementById('targetCalories').value);
  state.macroTargets = { protein: protein, carbs: carbs, fat: fat, calories: calories };
  save();
  render();
  showSettingsStatus('Objetivos guardados.');
}

// exportData() → serializes the full app state to a downloadable JSON file
// (rb-tracker-v6-YYYY-MM-DD.json), compatible with importData() below.
function exportData() {
  try {
    const payload = JSON.stringify(state, null, 2);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rb-tracker-v6-' + today() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showSettingsStatus('Datos exportados.');
  } catch (err) {
    console.error('[tracker-v6] exportData() failed', err);
    showSettingsStatus('Error al exportar.');
  }
}

// handleImportFile(e) → reads the selected file as text, parses it as JSON,
// and hands it to importData(). Guards against invalid/corrupt files.
function handleImportFile(e) {
  const input = e.target;
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    try {
      const parsed = JSON.parse(reader.result);
      importData(parsed);
    } catch (err) {
      console.error('[tracker-v6] handleImportFile() parse failed', err);
      showSettingsStatus('Archivo JSON inválido.');
    }
    input.value = '';
  };
  reader.onerror = function () {
    showSettingsStatus('No se pudo leer el archivo.');
    input.value = '';
  };
  reader.readAsText(file);
}

// importData(parsed) → merges a previously-exported (or v5.4-compatible)
// JSON payload into state: records, selectedPhase, and macroTargets are
// adopted when present and valid; anything missing/invalid falls back to
// the current in-memory state rather than being wiped. Persists and
// re-renders on success.
function importData(parsed) {
  if (!parsed || typeof parsed !== 'object') {
    showSettingsStatus('Archivo JSON inválido.');
    return;
  }
  state = {
    version: 6,
    protocols: PROTOCOLS,
    records: (parsed.records && typeof parsed.records === 'object') ? parsed.records : state.records,
    selectedPhase: (parsed.selectedPhase && PROTOCOLS[parsed.selectedPhase]) ? parsed.selectedPhase : state.selectedPhase,
    macroTargets: (parsed.macroTargets && typeof parsed.macroTargets === 'object') ? parsed.macroTargets : state.macroTargets
  };
  save();
  render();
  showSettingsStatus('Datos importados correctamente.');
}

// handleResetClick() → confirmation gate in front of resetData(), so a
// stray tap can't wipe all logged data.
function handleResetClick() {
  const ok = window.confirm('¿Restablecer todos los datos? Esta acción no se puede deshacer.');
  if (!ok) return;
  resetData();
}

// resetData() → clears the persisted v6 state from localStorage and resets
// the in-memory state back to its Task-1 defaults (Anabolismo phase, empty
// records), then re-renders.
function resetData() {
  try {
    localStorage.removeItem('rb_tracker_v6');
  } catch (err) {
    console.error('[tracker-v6] resetData() failed clearing storage', err);
  }
  state = {
    version: 6,
    protocols: PROTOCOLS,
    records: {},
    selectedPhase: 'Anabolismo',
    macroTargets: Object.assign({}, PROTOCOLS.Anabolismo.targets)
  };
  save();
  render();
  showSettingsStatus('Datos restablecidos.');
}

// showSettingsStatus(msg) → writes a short status message into the
// settings view's aria-live region (confirms save/export/import/reset).
function showSettingsStatus(msg) {
  const el = document.getElementById('settingsStatus');
  if (el) el.textContent = msg;
}

// ==========================================================================
// MAIN RENDER LOOP & EVENT HANDLERS (Task 8)
// Consumes: dashboard(), analyticsView(), showSettings() (above), rec(),
//           totals(), esc(), n(), today(), load()/save() persistence.
// Produces: render(), switchView(view), shiftDate(days),
//           attachEventListeners(), toggleTheme(), app initialization.
// ==========================================================================

// currentView / currentDate — transient UI state (which tab + which day
// are being viewed). Deliberately kept separate from `state` (the
// persisted data model): navigating tabs or days should never itself
// dirty localStorage.
let currentView = 'home';
let currentDate = today();

// load() → read persisted state from localStorage (rb_tracker_v6),
// merging it onto the in-code defaults so a save from an earlier version
// (or a partially-written one) can't leave required keys missing.
// `protocols` is always taken fresh from the live PROTOCOLS constant
// rather than whatever was serialized, so a code update to protocol
// targets isn't shadowed by a stale saved copy.
function load() {
  const defaults = {
    version: 6,
    protocols: PROTOCOLS,
    records: {},
    selectedPhase: 'Anabolismo',
    macroTargets: PROTOCOLS.Anabolismo.targets
  };
  try {
    const raw = localStorage.getItem('rb_tracker_v6');
    if (!raw) return defaults;
    const saved = JSON.parse(raw) || {};
    return {
      version: 6,
      protocols: PROTOCOLS,
      records: saved.records || {},
      selectedPhase: saved.selectedPhase || 'Anabolismo',
      macroTargets: saved.macroTargets || PROTOCOLS.Anabolismo.targets
    };
  } catch (e) {
    console.error('[tracker-v6] load() failed, using defaults', e);
    return defaults;
  }
}

// tabButton(view, icon, label) → one bottom-nav button. Internal helper
// for render(); marks itself .active when it matches currentView.
function tabButton(view, icon, label) {
  const active = currentView === view ? ' active' : '';
  return '<button type="button" class="tab-btn' + active + '" data-action="switch-view" data-view="' + view + '">' +
      '<span class="tab-icon">' + icon + '</span><span>' + esc(label) + '</span>' +
    '</button>';
}

// render() → the full app shell: header (title, phase subtitle, prev/next
// date buttons + date input, theme toggle) + the active view's content in
// <main> + the bottom tab bar. Replaces #root's innerHTML on every call;
// #root itself is never replaced, which is what lets the single delegated
// listener set up in attachEventListeners() keep working after every
// re-render without being reattached.
function render() {
  const root = document.getElementById('root');
  if (!root) return;

  const theme = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const themeIcon = theme === 'dark' ? '☀️' : '🌙';

  const views = { home: dashboard, analytics: analyticsView, settings: showSettings };
  const viewFn = views[currentView] || dashboard;
  const viewHtml = viewFn();

  root.innerHTML =
    '<header>' +
        '<button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Cambiar tema">' + themeIcon + '</button>' +
        '<h1>Tracker v6.0</h1>' +
        '<div class="subtitle">' + esc(state.selectedPhase) + '</div>' +
        '<div class="controls">' +
          '<button type="button" data-action="shift-date" data-days="-1" aria-label="Día anterior">&#9664;</button>' +
          '<input type="date" id="dateInput" value="' + esc(currentDate) + '">' +
          '<button type="button" data-action="shift-date" data-days="1" aria-label="Día siguiente">&#9654;</button>' +
        '</div>' +
      '</header>' +
    '<main>' + viewHtml + '</main>' +
    '<nav id="tabs">' +
        tabButton('home', '🏠', 'Inicio') +
        tabButton('analytics', '📊', 'Analítica') +
        tabButton('settings', '⚙️', 'Ajustes') +
      '</nav>';
}

// switchView(view) → change the active tab ('home' | 'analytics' |
// 'settings') and re-render. Unrecognized values fall back to 'home'
// rather than rendering a blank view.
function switchView(view) {
  currentView = (view === 'analytics' || view === 'settings') ? view : 'home';
  render();
}

// shiftDate(days) → move currentDate by `days` (e.g. -1/+1 for the
// header's prev/next buttons) and re-render. Uses the same
// local-timezone-safe date math as today() so the displayed date never
// drifts near midnight.
function shiftDate(days) {
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() + n(days));
  const localMs = d.getTime() - d.getTimezoneOffset() * 60000;
  currentDate = new Date(localMs).toISOString().slice(0, 10);
  render();
}

// toggleTheme() → flip the explicit data-theme override on <html> between
// 'light' and 'dark' (absence of the attribute means "follow system
// preference", per the CSS at the top of the <style> block), persist the
// choice separately from app data, and re-render so the header icon and
// all `:root[data-theme]` CSS updates.
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current
    ? current === 'dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('rb_tracker_v6_theme', next); } catch (e) {}
  render();
}

// applyStoredTheme() → restore a previously-toggled theme preference (if
// any) before the first render, so a reload doesn't flash back to the
// system default after the user explicitly chose light/dark.
function applyStoredTheme() {
  try {
    const saved = localStorage.getItem('rb_tracker_v6_theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
}

// attachEventListeners() → wire up all interactive behavior via event
// delegation on the persistent #root element, so ONE call at startup
// keeps working across every future render() (which only ever replaces
// #root's children, never #root itself). Handles: bottom-tab clicks
// (switch-view), prev/next date buttons (shift-date), the theme toggle,
// and the date <input>'s change event.
function attachEventListeners() {
  const root = document.getElementById('root');
  if (!root) return;

  root.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    if (action === 'switch-view') {
      switchView(btn.getAttribute('data-view'));
    } else if (action === 'shift-date') {
      shiftDate(n(btn.getAttribute('data-days')));
    } else if (action === 'toggle-theme') {
      toggleTheme();
    } else if (action === 'open-phase-selector') {
      openPhaseSelector();
    } else if (action === 'export-data') {
      exportData();
    } else if (action === 'trigger-import') {
      const importInput = document.getElementById('importFile');
      if (importInput) importInput.click();
    } else if (action === 'reset-data') {
      handleResetClick();
    }
  });

  root.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'targetForm') {
      handleTargetSubmit(e);
    }
  });

  root.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'dateInput') {
      currentDate = e.target.value || today();
      render();
    } else if (e.target && e.target.id === 'importFile') {
      handleImportFile(e);
    }
  });
}

// --------------------------------------------------------------------------
// PEPTIDE MODAL (Task 5)
// Consumes: PEPTIDES_DB, PROTOCOLS (via state.selectedPhase), rec(), save(), esc(), n(), today()
// Produces: peptideModal(), closePeptide(), handlePeptideSubmit(e)
// Glue (not in the task's named-function list, mirrors Task 4's pattern so
// this task is testable end-to-end ahead of Task 6/8 wiring it up):
// openPeptideModal(), attachPeptideModalListeners(), renderPeptideHint(),
// last5Peptides(), freqLabel(), uid()
// --------------------------------------------------------------------------

// uid() → short unique id for peptide-injection log entries. Not
// cryptographically unique, just collision-safe enough for a personal
// tracker's localStorage records.
function uid() {
  return 'pep_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

// freqLabel(freq) → human-readable (Spanish) label for a PEPTIDES_DB
// default_frequency code, used in the protocol hint.
const FREQ_LABELS = {
  on_demand: 'A demanda',
  daily: 'Diario',
  '3x_week': '3x / semana',
  '2x_week': '2x / semana',
  weekly: 'Semanal',
  weekdays_only: 'Lun–Vie'
};
function freqLabel(freq) {
  return FREQ_LABELS[freq] || freq || '—';
}

// last5Peptides() → flatten peptide-injection entries from every day in
// state.records, newest first by date+time, capped to 5. Backs the
// "Historial" section inside peptideModal().
function last5Peptides() {
  const all = [];
  Object.keys(state.records).forEach(function (date) {
    (state.records[date].peptides || []).forEach(function (p) { all.push(p); });
  });
  all.sort(function (a, b) {
    const ka = (a.date || '') + ' ' + (a.time || '');
    const kb = (b.date || '') + ' ' + (b.time || '');
    return kb.localeCompare(ka);
  });
  return all.slice(0, 5);
}

// peptideModal() → HTML string for the full modal (overlay + panel):
// peptide <select> grouped Núcleo/Opcionales (21 PEPTIDES_DB entries), dose
// + time inputs, a protocol-hint slot (filled by renderPeptideHint() on
// change), and the last-5-injections historial.
function peptideModal() {
  const optionHtml = function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.nombre) + '</option>'; };
  const coreOptions = PEPTIDES_DB.filter(function (p) { return p.tier === 'core'; }).map(optionHtml).join('');
  const optionalOptions = PEPTIDES_DB.filter(function (p) { return p.tier === 'optional'; }).map(optionHtml).join('');

  const historial = last5Peptides();
  const historialHtml = historial.length ? historial.map(function (h) {
    return '' +
      '<div class="list-item">' +
        '<div class="item-main">' +
          '<div class="item-title">' + esc(h.nombre) + '</div>' +
          '<div class="item-sub">' + esc(h.date) + ' · ' + esc(h.time || '') + '</div>' +
        '</div>' +
        '<div class="item-meta">' + n(h.dose) + ' u.</div>' +
      '</div>';
  }).join('') : '<div class="empty-state"><div class="empty-icon">💉</div>Sin inyecciones registradas todavía</div>';

  return '' +
    '<div class="modal-overlay" id="peptideModalOverlay" onclick="if(event.target===this) closePeptide()">' +
      '<div class="modal active" id="peptideModal" role="dialog" aria-modal="true" aria-labelledby="peptideModalTitle">' +
        '<div class="modal-header">' +
          '<h2 id="peptideModalTitle">Registrar inyección</h2>' +
          '<button type="button" class="modal-close" onclick="closePeptide()" aria-label="Cerrar">&times;</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<form id="peptideForm">' +
            '<div class="form-group">' +
              '<label for="peptideSelect">Péptido</label>' +
              '<select id="peptideSelect" required>' +
                '<option value="" disabled selected>Selecciona un péptido…</option>' +
                '<optgroup label="Núcleo">' + coreOptions + '</optgroup>' +
                '<optgroup label="Opcionales">' + optionalOptions + '</optgroup>' +
              '</select>' +
            '</div>' +
            '<div id="peptideHint"></div>' +
            '<div class="form-row">' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="peptideDose">Dosis</label>' +
                '<div class="input-group">' +
                  '<input type="number" id="peptideDose" inputmode="decimal" min="0" step="0.5" required>' +
                  '<span class="input-suffix">u.</span>' +
                '</div>' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="peptideTime">Hora</label>' +
                '<input type="time" id="peptideTime" required>' +
              '</div>' +
            '</div>' +
            '<h3 class="mt-4 mb-2">Últimas 5 inyecciones</h3>' +
            '<div id="peptideHistorial">' + historialHtml + '</div>' +
          '</form>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn secondary" onclick="closePeptide()">Cancelar</button>' +
          '<button type="submit" form="peptideForm" class="btn">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

// openPeptideModal() → inserts peptideModal() into the DOM, defaults the
// time input to "now", and wires its listeners. Kept here (mirroring
// openMealModal() from Task 4) so this task is testable end-to-end ahead of
// Task 6's quick-action buttons calling it directly.
function openPeptideModal() {
  closePeptide(); // remove any stale instance first
  document.body.insertAdjacentHTML('beforeend', peptideModal());
  const timeInput = document.getElementById('peptideTime');
  if (timeInput) {
    const now = new Date();
    timeInput.value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }
  attachPeptideModalListeners();
}

// attachPeptideModalListeners() → form submit + peptide-select change
// (renders the protocol hint and auto-fills the suggested dose).
function attachPeptideModalListeners() {
  const form = document.getElementById('peptideForm');
  const select = document.getElementById('peptideSelect');
  if (form) form.addEventListener('submit', handlePeptideSubmit);
  if (select) {
    select.addEventListener('change', function () {
      renderPeptideHint(select.value);
      const pep = PEPTIDES_DB.find(function (p) { return p.id === select.value; });
      const doseInput = document.getElementById('peptideDose');
      if (pep && pep.default_dose != null && doseInput && !doseInput.value) {
        doseInput.value = pep.default_dose;
      }
    });
  }
}

// renderPeptideHint(peptideId) → fills #peptideHint with the selected
// peptide's suggested dose/frequency/notes plus a badge for the currently
// active protocol phase (state.selectedPhase / PROTOCOLS), tying
// PEPTIDES_DB data back to the phase the user is actually running.
function renderPeptideHint(peptideId) {
  const hintEl = document.getElementById('peptideHint');
  if (!hintEl) return;
  const pep = PEPTIDES_DB.find(function (p) { return p.id === peptideId; });
  if (!pep) { hintEl.innerHTML = ''; return; }
  const phase = state.selectedPhase;
  const phaseInfo = PROTOCOLS[phase];
  hintEl.innerHTML = '' +
    '<div class="banner info mt-2 mb-3">' +
      '<strong>' + esc(pep.nombre) + '</strong><br>' +
      'Dosis sugerida: ' + (pep.default_dose != null ? pep.default_dose + ' u.' : 'variable') +
      ' · Frecuencia: ' + esc(freqLabel(pep.default_frequency)) + '<br>' +
      '<span class="muted">' + esc(pep.notes) + '</span><br>' +
      '<span class="badge primary mt-2">Fase actual: ' + esc(phase) + '</span> ' +
      '<span class="faint">' + esc(phaseInfo ? phaseInfo.description : '') + '</span>' +
    '</div>';
}

// closePeptide() → removes the peptide modal overlay from the DOM, if present.
function closePeptide() {
  const overlay = document.getElementById('peptideModalOverlay');
  if (overlay) overlay.remove();
}

// handlePeptideSubmit(e) → validates the form, pushes a new injection entry
// into today's rec().peptides, persists via save(), closes the modal, and
// re-renders if the main render loop (Task 8) exists.
function handlePeptideSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();

  const select = document.getElementById('peptideSelect');
  const doseInput = document.getElementById('peptideDose');
  const timeInput = document.getElementById('peptideTime');
  const pep = PEPTIDES_DB.find(function (p) { return p.id === (select ? select.value : ''); });
  if (!pep || !doseInput || !doseInput.value) return;

  const logDate = typeof currentDate !== 'undefined' ? currentDate : today();
  const entry = {
    id: uid(),
    peptideId: pep.id,
    nombre: pep.nombre,
    dose: n(doseInput.value),
    time: timeInput ? timeInput.value : '',
    date: logDate
  };
  rec(logDate).peptides.push(entry);
  save();
  closePeptide();
  if (typeof render === 'function') render();
}

// --------------------------------------------------------------------------
// CHECK-IN MODAL (Task 5)
// Consumes: rec(), save(), esc(), n()
// Produces: checkinModal(), closeCheckin(), handleCheckinSubmit(e)
// Glue: openCheckinModal(), attachCheckinModalListeners()
// --------------------------------------------------------------------------

const SLEEP_QUALITY_LABELS = { mala: 'Mala', regular: 'Regular', buena: 'Buena', excelente: 'Excelente' };

// checkinModal() → HTML string for the daily check-in modal: water (L),
// sleep hours + quality, weight (kg), and a free-text notes textarea,
// pre-filled from the viewed day's rec().checkin if one already exists.
function checkinModal() {
  const c = rec(typeof currentDate !== 'undefined' ? currentDate : undefined).checkin || {};
  const qualityOptions = Object.keys(SLEEP_QUALITY_LABELS).map(function (k) {
    return '<option value="' + k + '"' + (c.sleepQuality === k ? ' selected' : '') + '>' + SLEEP_QUALITY_LABELS[k] + '</option>';
  }).join('');

  return '' +
    '<div class="modal-overlay" id="checkinModalOverlay" onclick="if(event.target===this) closeCheckin()">' +
      '<div class="modal active" id="checkinModal" role="dialog" aria-modal="true" aria-labelledby="checkinModalTitle">' +
        '<div class="modal-header">' +
          '<h2 id="checkinModalTitle">Check-in diario</h2>' +
          '<button type="button" class="modal-close" onclick="closeCheckin()" aria-label="Cerrar">&times;</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<form id="checkinForm">' +
            '<div class="form-row">' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="checkinWater">Agua (L)</label>' +
                '<input type="number" id="checkinWater" inputmode="decimal" min="0" step="0.1" value="' + (c.water != null ? c.water : '') + '">' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="checkinWeight">Peso (kg)</label>' +
                '<input type="number" id="checkinWeight" inputmode="decimal" min="0" step="0.1" value="' + (c.weight != null ? c.weight : '') + '">' +
              '</div>' +
            '</div>' +
            '<div class="form-row">' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="checkinSleepHours">Sueño (horas)</label>' +
                '<input type="number" id="checkinSleepHours" inputmode="decimal" min="0" max="24" step="0.5" value="' + (c.sleepHours != null ? c.sleepHours : '') + '">' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="checkinSleepQuality">Calidad de sueño</label>' +
                '<select id="checkinSleepQuality">' +
                  '<option value="" disabled' + (c.sleepQuality ? '' : ' selected') + '>Selecciona…</option>' +
                  qualityOptions +
                '</select>' +
              '</div>' +
            '</div>' +
            '<div class="form-group">' +
              '<label for="checkinNotes">Notas</label>' +
              '<textarea id="checkinNotes" placeholder="Observaciones del día…">' + esc(c.notes || '') + '</textarea>' +
            '</div>' +
          '</form>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn secondary" onclick="closeCheckin()">Cancelar</button>' +
          '<button type="submit" form="checkinForm" class="btn">Guardar</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

// openCheckinModal() → inserts checkinModal() into the DOM and wires its
// listeners. Mirrors openMealModal()/openPeptideModal() so this task is
// testable end-to-end ahead of Task 6's quick-action buttons.
function openCheckinModal() {
  closeCheckin(); // remove any stale instance first
  document.body.insertAdjacentHTML('beforeend', checkinModal());
  attachCheckinModalListeners();
}

// attachCheckinModalListeners() → wires the check-in form's submit handler.
function attachCheckinModalListeners() {
  const form = document.getElementById('checkinForm');
  if (form) form.addEventListener('submit', handleCheckinSubmit);
}

// closeCheckin() → removes the check-in modal overlay from the DOM, if present.
function closeCheckin() {
  const overlay = document.getElementById('checkinModalOverlay');
  if (overlay) overlay.remove();
}

// handleCheckinSubmit(e) → reads the form, persists a single checkin object
// on the viewed day's record (overwriting any earlier check-in for the same
// day), saves, closes the modal, and re-renders if the main render loop
// (Task 8) exists.
function handleCheckinSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();

  const water = document.getElementById('checkinWater').value;
  const weight = document.getElementById('checkinWeight').value;
  const sleepHours = document.getElementById('checkinSleepHours').value;
  const sleepQuality = document.getElementById('checkinSleepQuality').value;
  const notes = document.getElementById('checkinNotes').value;

  rec(typeof currentDate !== 'undefined' ? currentDate : undefined).checkin = {
    water: water !== '' ? n(water) : null,
    weight: weight !== '' ? n(weight) : null,
    sleepHours: sleepHours !== '' ? n(sleepHours) : null,
    sleepQuality: sleepQuality || null,
    notes: notes || '',
    savedAt: new Date().toISOString()
  };
  save();
  closeCheckin();
  if (typeof render === 'function') render();
}

// --------------------------------------------------------------------------
// MIGRATION — v5→v6 legacy data recovery (Task 10, "Phase 1" / opción 2).
// Implemented independently of the main render loop (Task 8): everything
// here touches only `state`, `save()`, plain localStorage reads, and the
// existing n()/uid() helpers, so it is fully testable standalone (e.g.
// from a console) before dashboard/modals/analytics are renderable.
// --------------------------------------------------------------------------

// LEGACY_KEYS — every localStorage key a prior version of this tracker is
// known to have used, newest-first, so a newer legacy version wins if more
// than one happens to be present in the same browser.
const LEGACY_KEYS = ['rb_tracker_v5', 'rb_tracker_v4', 'rb_tracker_v3', 'rb_tracker_v2', 'rb_tracker', 'rbTracker'];

// migrateMeal(m) → adapt one legacy meal entry into the v6 meal shape
// ({id, name, foodId, gramos, isCocido, prot, carb, fat, kcal,
// timestamp}). Legacy trackers (v5 and older) logged meals as free-typed
// {name, calories, protein, carbs, fat} with no FOOD_DB/gramos concept, so
// foodId/gramos/isCocido have no legacy source and default to null/0/false;
// name and the four macro fields are what actually carries over (accepting
// either the legacy calories/protein/carbs names or v6's kcal/prot/carb,
// in case a mixed-version record is ever encountered).
function migrateMeal(m) {
  if (!m || typeof m !== 'object') return null;
  return {
    id: m.id || ('m_migrated_' + Math.random().toString(36).slice(2, 10)),
    name: m.name || m.label || 'Comida migrada',
    foodId: m.foodId || null,
    gramos: n(m.gramos != null ? m.gramos : m.grams),
    isCocido: !!m.isCocido,
    prot: n(m.prot != null ? m.prot : m.protein),
    carb: n(m.carb != null ? m.carb : m.carbs),
    fat: n(m.fat),
    kcal: n(m.kcal != null ? m.kcal : m.calories),
    timestamp: m.timestamp || null
  };
}

// migratePeptide(p, date) → adapt one legacy peptide entry (v5 shape:
// {id, label, mechanism, dosage_protocol, dosage_applied, status,
// timestamp}) into a v6 injection-log entry ({id, peptideId, nombre,
// dose, time, date}). Legacy peptides were a per-day status toggle
// covering the whole protocol roster (pending/done/skipped for every
// peptide, every day), not a log of actual injections — so only
// status === 'done' entries (a dose was actually applied) are carried
// over; migrating 'pending'/'skipped' placeholders would flood v6's
// injection historial with doses that were never given. Returns null for
// anything else so callers can .filter(Boolean).
function migratePeptide(p, date) {
  if (!p || typeof p !== 'object' || p.status !== 'done') return null;
  const ts = p.timestamp ? new Date(p.timestamp) : null;
  const time = (ts && !isNaN(ts.getTime()))
    ? String(ts.getHours()).padStart(2, '0') + ':' + String(ts.getMinutes()).padStart(2, '0')
    : '';
  return {
    id: uid(),
    peptideId: p.id || p.peptideId || '',
    nombre: p.label || p.nombre || p.id || 'Péptido migrado',
    dose: n(p.dosage_applied != null ? p.dosage_applied : p.dose),
    time: time,
    date: date
  };
}

// migrateCheckin(legacyRec) → adapt legacy per-day hydration/sleep/weight/
// recovery fields (spread across legacyRec.hydration, .sleep, .weight,
// .recovery in v5) into a single v6 checkin object ({water, weight,
// sleepHours, sleepQuality, notes, savedAt}). Returns null when none of
// those fields actually carry data, so a day with nothing logged doesn't
// get a synthetic empty checkin created for it.
function migrateCheckin(legacyRec) {
  const hydration = legacyRec.hydration || {};
  const sleep = legacyRec.sleep || {};
  const recovery = legacyRec.recovery || {};
  const hasWater = hydration.liters != null && n(hydration.liters) > 0;
  const hasWeight = legacyRec.weight != null;
  const hasSleep = sleep.hours != null && n(sleep.hours) > 0;
  if (!hasWater && !hasWeight && !hasSleep) return null;

  const notes = [hydration.notes, sleep.notes, recovery.notes]
    .filter(function (x) { return x; })
    .join(' | ');

  return {
    water: hasWater ? n(hydration.liters) : null,
    weight: hasWeight ? n(legacyRec.weight) : null,
    sleepHours: hasSleep ? n(sleep.hours) : null,
    sleepQuality: sleep.quality || null,
    notes: notes,
    savedAt: legacyRec.date ? legacyRec.date + 'T00:00:00.000Z' : new Date().toISOString()
  };
}

// migrateFromV5() → one-shot recovery of any pre-v6 tracker data sitting in
// this browser's localStorage. Scans LEGACY_KEYS in order and adapts the
// FIRST key that parses to at least one usable record (so a present-but-
// empty v5 key can't shadow real data sitting in an older v4/v3 key). For
// every legacy record found: meals → migrateMeal() per entry, peptides →
// migratePeptide() per entry (status==='done' only), checkin →
// migrateCheckin() from that day's hydration/sleep/weight. Records are
// merged into state.records keyed by date; a date already present in
// state.records is never overwritten (defensive — the call site is only
// meant to invoke this when state.records is empty). Persists via save()
// when anything was migrated. Returns the number of days migrated (0 if no
// legacy data was found, or the only legacy data found was already empty).
function migrateFromV5() {
  let sourceKey = null;
  let sourceData = null;

  for (let i = 0; i < LEGACY_KEYS.length; i++) {
    const key = LEGACY_KEYS[i];
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      const parsed = JSON.parse(raw);
      const records = (parsed && parsed.records && typeof parsed.records === 'object') ? parsed.records : null;
      if (records && Object.keys(records).length > 0) {
        sourceKey = key;
        sourceData = parsed;
        break;
      }
    } catch (e) {
      console.error('[tracker-v6] migrateFromV5: failed to parse legacy key "' + key + '"', e);
    }
  }

  if (!sourceData) {
    console.log('[tracker-v6] migrateFromV5: no legacy data found, nothing to migrate');
    return 0;
  }

  let migratedDays = 0;
  Object.keys(sourceData.records).forEach(function (date) {
    const legacyRec = sourceData.records[date];
    if (!legacyRec || typeof legacyRec !== 'object') return;
    if (state.records[date]) return; // never clobber an existing v6 record

    const meals = (legacyRec.meals || []).map(migrateMeal).filter(Boolean);
    const peptides = (legacyRec.peptides || [])
      .map(function (p) { return migratePeptide(p, date); })
      .filter(Boolean);
    const checkin = migrateCheckin(legacyRec);

    state.records[date] = { date: date, meals: meals, peptides: peptides, checkin: checkin };
    migratedDays++;
  });

  if (migratedDays > 0) {
    save();
    console.log('[tracker-v6] migrateFromV5: migrated ' + migratedDays + ' day(s) from "' + sourceKey + '"');
  } else {
    console.log('[tracker-v6] migrateFromV5: source "' + sourceKey + '" had no new days to migrate');
  }
  return migratedDays;
}

// --------------------------------------------------------------------------
// INIT — bootstraps the app once the data layer + all views are defined.
// --------------------------------------------------------------------------
applyStoredTheme();
state = load();
if (Object.keys(state.records).length === 0) migrateFromV5();
attachEventListeners();
render();
</script>
