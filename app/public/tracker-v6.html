// ==========================================================================
// MAIN RENDER LOOP & EVENT HANDLERS (Task 8)
// Consumes: dashboard(), analyticsView(), showSettings() (above), rec(),
//           totals(), esc(), n(), today(), load()/save() persistence.
// Produces: render(), switchView(view), shiftDate(days),
//           attachEventListeners(), toggleTheme(), app initialization.
// ==========================================================================

// currentView / currentDate — transient UI state (which tab + which day
// are being viewed). Deliberately kept separate from `state` (the
// persisted data model): navigating tabs or days should never itself
// dirty localStorage.
let currentView = 'home';
let currentDate = today();

// load() → read persisted state from localStorage (rb_tracker_v6),
// merging it onto the in-code defaults so a save from an earlier version
// (or a partially-written one) can't leave required keys missing.
// `protocols` is always taken fresh from the live PROTOCOLS constant
// rather than whatever was serialized, so a code update to protocol
// targets isn't shadowed by a stale saved copy.
function load() {
  const defaults = {
    version: 6,
    protocols: PROTOCOLS,
    records: {},
    selectedPhase: 'Anabolismo',
    macroTargets: PROTOCOLS.Anabolismo.targets,
    medications: {
      tirzepatida: { id: 'tirzepatida', dosis_actual: 2.5, fecha_inicio: '2026-08-09', estado: 'activo', notas: '' }
    }
  };
  try {
    const raw = localStorage.getItem('rb_tracker_v6');
    if (!raw) return defaults;
    const saved = JSON.parse(raw) || {};
    return {
      version: 6,
      protocols: PROTOCOLS,
      records: saved.records || {},
      selectedPhase: saved.selectedPhase || 'Anabolismo',
      macroTargets: saved.macroTargets || PROTOCOLS.Anabolismo.targets,
      medications: saved.medications || defaults.medications
    };
  } catch (e) {
    console.error('[tracker-v6] load() failed, using defaults', e);
    return defaults;
  }
}

// tabButton(view, icon, label) → one bottom-nav button. Internal helper
// for render(); marks itself .active when it matches currentView.
function tabButton(view, icon, label) {
  const active = currentView === view ? ' active' : '';
  return '<button type="button" class="tab-btn' + active + '" data-action="switch-view" data-view="' + view + '">' +
      '<span class="tab-icon">' + icon + '</span><span>' + esc(label) + '</span>' +
    '</button>';
}

// render() → the full app shell: header (title, phase subtitle, prev/next
// date buttons + date input, theme toggle) + the active view's content in
// <main> + the bottom tab bar. Replaces #root's innerHTML on every call;
// #root itself is never replaced, which is what lets the single delegated
// listener set up in attachEventListeners() keep working after every
// re-render without being reattached.
function render() {
  const root = document.getElementById('root');
  if (!root) return;

  const theme = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const themeIcon = theme === 'dark' ? '☀️' : '🌙';

  const views = { home: dashboard, analytics: analyticsView, settings: showSettings };
  const viewFn = views[currentView] || dashboard;
  const viewHtml = viewFn();

  root.innerHTML =
    '<header>' +
        '<button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Cambiar tema">' + themeIcon + '</button>' +
        '<h1>Tracker v6.0</h1>' +
        '<div class="subtitle">' + esc(state.selectedPhase) + '</div>' +
        '<div class="controls">' +
          '<button type="button" data-action="shift-date" data-days="-1" aria-label="Día anterior">&#9664;</button>' +
          '<input type="date" id="dateInput" value="' + esc(currentDate) + '">' +
          '<button type="button" data-action="shift-date" data-days="1" aria-label="Día siguiente">&#9654;</button>' +
        '</div>' +
      '</header>' +
    '<main>' + viewHtml + '</main>' +
    '<nav id="tabs">' +
        tabButton('home', '🏠', 'Inicio') +
        tabButton('analytics', '📊', 'Analítica') +
        tabButton('settings', '⚙️', 'Ajustes') +
      '</nav>';
}

// switchView(view) → change the active tab ('home' | 'analytics' |
// 'settings') and re-render. Unrecognized values fall back to 'home'
// rather than rendering a blank view.
function switchView(view) {
  currentView = (view === 'analytics' || view === 'settings') ? view : 'home';
  render();
}

// shiftDate(days) → move currentDate by `days` (e.g. -1/+1 for the
// header's prev/next buttons) and re-render. Uses the same
// local-timezone-safe date math as today() so the displayed date never
// drifts near midnight.
function shiftDate(days) {
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() + n(days));
  const localMs = d.getTime() - d.getTimezoneOffset() * 60000;
  currentDate = new Date(localMs).toISOString().slice(0, 10);
  render();
}

// toggleTheme() → flip the explicit data-theme override on <html> between
// 'light' and 'dark' (absence of the attribute means "follow system
// preference", per the CSS at the top of the <style> block), persist the
// choice separately from app data, and re-render so the header icon and
// all `:root[data-theme]` CSS updates.
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current
    ? current === 'dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('rb_tracker_v6_theme', next); } catch (e) {}
  render();
}

// applyStoredTheme() → restore a previously-toggled theme preference (if
// any) before the first render, so a reload doesn't flash back to the
// system default after the user explicitly chose light/dark.
function applyStoredTheme() {
  try {
    const saved = localStorage.getItem('rb_tracker_v6_theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
}

// attachEventListeners() → wire up all interactive behavior via event
// delegation on the persistent #root element, so ONE call at startup
// keeps working across every future render() (which only ever replaces
// #root's children, never #root itself). Handles: bottom-tab clicks
// (switch-view), prev/next date buttons (shift-date), the theme toggle,
// and the date <input>'s change event.
function attachEventListeners() {
  const root = document.getElementById('root');
  if (!root) return;

  root.addEventListener('click', function (e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.getAttribute('data-action');
    if (action === 'switch-view') {
      switchView(btn.getAttribute('data-view'));
    } else if (action === 'shift-date') {
      shiftDate(n(btn.getAttribute('data-days')));
    } else if (action === 'toggle-theme') {
      toggleTheme();
    } else if (action === 'open-phase-selector') {
      openPhaseSelector();
    } else if (action === 'export-data') {
      exportData();
    } else if (action === 'trigger-import') {
      const importInput = document.getElementById('importFile');
      if (importInput) importInput.click();
    } else if (action === 'import-apple-health') {
      openAppleHealthModal();
    } else if (action === 'reset-data') {
      handleResetClick();
    }
  });

  root.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'targetForm') {
      handleTargetSubmit(e);
    }
  });

  root.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'dateInput') {
      currentDate = e.target.value || today();
      render();
    } else if (e.target && e.target.id === 'importFile') {
      handleImportFile(e);
    }
  });
}

// uid() → short unique id for peptide-injection log entries. Not
// cryptographically unique, just collision-safe enough for a personal
// tracker's localStorage records.
function uid() {
  return 'pep_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

// freqLabel(freq) → human-readable (Spanish) label for a PEPTIDES_DB
// default_frequency code, used in the protocol hint.
const FREQ_LABELS = {
  on_demand: 'A demanda',
  daily: 'Diario',
  '3x_week': '3x / semana',
  '2x_week': '2x / semana',
  weekly: 'Semanal',
  weekdays_only: 'Lun–Vie'
};
function freqLabel(freq) {
  return FREQ_LABELS[freq] || freq || '—';
}

// last5Peptides() → flatten peptide-injection entries from every day in
// state.records, newest first by date+time, capped to 5. Backs the
// "Historial" section inside peptideModal().
function last5Peptides() {
  const all = [];
  Object.keys(state.records).forEach(function (date) {
    (state.records[date].peptides || []).forEach(function (p) { all.push(p); });
  });
  all.sort(function (a, b) {
    const ka = (a.date || '') + ' ' + (a.time || '');
    const kb = (b.date || '') + ' ' + (b.time || '');
    return kb.localeCompare(ka);
  });
  return all.slice(0, 5);
}

// --------------------------------------------------------------------------
// MIGRATION — v5→v6 legacy data recovery (Task 10, "Phase 1" / opción 2).
// Implemented independently of the main render loop (Task 8): everything
// here touches only `state`, `save()`, plain localStorage reads, and the
// existing n()/uid() helpers, so it is fully testable standalone (e.g.
// from a console) before dashboard/modals/analytics are renderable.
// --------------------------------------------------------------------------

// LEGACY_KEYS — every localStorage key a prior version of this tracker is
// known to have used, newest-first, so a newer legacy version wins if more
// than one happens to be present in the same browser.
const LEGACY_KEYS = ['rb_tracker_v5', 'rb_tracker_v4', 'rb_tracker_v3', 'rb_tracker_v2', 'rb_tracker', 'rbTracker'];

// migrateMeal(m) → adapt one legacy meal entry into the v6 meal shape
// ({id, name, foodId, gramos, isCocido, prot, carb, fat, kcal,
// timestamp}). Legacy trackers (v5 and older) logged meals as free-typed
// {name, calories, protein, carbs, fat} with no FOOD_DB/gramos concept, so
// foodId/gramos/isCocido have no legacy source and default to null/0/false;
// name and the four macro fields are what actually carries over (accepting
// either the legacy calories/protein/carbs names or v6's kcal/prot/carb,
// in case a mixed-version record is ever encountered).
function migrateMeal(m) {
  if (!m || typeof m !== 'object') return null;
  return {
    id: m.id || ('m_migrated_' + Math.random().toString(36).slice(2, 10)),
    name: m.name || m.label || 'Comida migrada',
    foodId: m.foodId || null,
    gramos: n(m.gramos != null ? m.gramos : m.grams),
    isCocido: !!m.isCocido,
    prot: n(m.prot != null ? m.prot : m.protein),
    carb: n(m.carb != null ? m.carb : m.carbs),
    fat: n(m.fat),
    kcal: n(m.kcal != null ? m.kcal : m.calories),
    timestamp: m.timestamp || null
  };
}

// migratePeptide(p, date) → adapt one legacy peptide entry (v5 shape:
// {id, label, mechanism, dosage_protocol, dosage_applied, status,
// timestamp}) into a v6 injection-log entry ({id, peptideId, nombre,
// dose, time, date}). Legacy peptides were a per-day status toggle
// covering the whole protocol roster (pending/done/skipped for every
// peptide, every day), not a log of actual injections — so only
// status === 'done' entries (a dose was actually applied) are carried
// over; migrating 'pending'/'skipped' placeholders would flood v6's
// injection historial with doses that were never given. Returns null for
// anything else so callers can .filter(Boolean).
function migratePeptide(p, date) {
  if (!p || typeof p !== 'object' || p.status !== 'done') return null;
  const ts = p.timestamp ? new Date(p.timestamp) : null;
  const time = (ts && !isNaN(ts.getTime()))
    ? String(ts.getHours()).padStart(2, '0') + ':' + String(ts.getMinutes()).padStart(2, '0')
    : '';
  return {
    id: uid(),
    peptideId: p.id || p.peptideId || '',
    nombre: p.label || p.nombre || p.id || 'Péptido migrado',
    dose: n(p.dosage_applied != null ? p.dosage_applied : p.dose),
    time: time,
    date: date
  };
}

// migrateCheckin(legacyRec) → adapt legacy per-day hydration/sleep/weight/
// recovery fields (spread across legacyRec.hydration, .sleep, .weight,
// .recovery in v5) into a single v6 checkin object ({water, weight,
// sleepHours, sleepQuality, notes, savedAt}). Returns null when none of
// those fields actually carry data, so a day with nothing logged doesn't
// get a synthetic empty checkin created for it.
function migrateCheckin(legacyRec) {
  const hydration = legacyRec.hydration || {};
  const sleep = legacyRec.sleep || {};
  const recovery = legacyRec.recovery || {};
  const hasWater = hydration.liters != null && n(hydration.liters) > 0;
  const hasWeight = legacyRec.weight != null;
  const hasSleep = sleep.hours != null && n(sleep.hours) > 0;
  if (!hasWater && !hasWeight && !hasSleep) return null;

  const notes = [hydration.notes, sleep.notes, recovery.notes]
    .filter(function (x) { return x; })
    .join(' | ');

  return {
    water: hasWater ? n(hydration.liters) : null,
    weight: hasWeight ? n(legacyRec.weight) : null,
    sleepHours: hasSleep ? n(sleep.hours) : null,
    sleepQuality: sleep.quality || null,
    notes: notes,
    savedAt: legacyRec.date ? legacyRec.date + 'T00:00:00.000Z' : new Date().toISOString()
  };
}

// migrateFromV5() → one-shot recovery of any pre-v6 tracker data sitting in
// this browser's localStorage. Scans LEGACY_KEYS in order and adapts the
// FIRST key that parses to at least one usable record (so a present-but-
// empty v5 key can't shadow real data sitting in an older v4/v3 key). For
// every legacy record found: meals → migrateMeal() per entry, peptides →
// migratePeptide() per entry (status==='done' only), checkin →
// migrateCheckin() from that day's hydration/sleep/weight. Records are
// merged into state.records keyed by date; a date already present in
// state.records is never overwritten (defensive — the call site is only
// meant to invoke this when state.records is empty). Persists via save()
// when anything was migrated. Returns the number of days migrated (0 if no
// legacy data was found, or the only legacy data found was already empty).
function migrateFromV5() {
  let sourceKey = null;
  let sourceData = null;

  for (let i = 0; i < LEGACY_KEYS.length; i++) {
    const key = LEGACY_KEYS[i];
    try {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      const parsed = JSON.parse(raw);
      const records = (parsed && parsed.records && typeof parsed.records === 'object') ? parsed.records : null;
      if (records && Object.keys(records).length > 0) {
        sourceKey = key;
        sourceData = parsed;
        break;
      }
    } catch (e) {
      console.error('[tracker-v6] migrateFromV5: failed to parse legacy key "' + key + '"', e);
    }
  }

  if (!sourceData) {
    console.log('[tracker-v6] migrateFromV5: no legacy data found, nothing to migrate');
    return 0;
  }

  let migratedDays = 0;
  Object.keys(sourceData.records).forEach(function (date) {
    const legacyRec = sourceData.records[date];
    if (!legacyRec || typeof legacyRec !== 'object') return;
    if (state.records[date]) return; // never clobber an existing v6 record

    const meals = (legacyRec.meals || []).map(migrateMeal).filter(Boolean);
    const peptides = (legacyRec.peptides || [])
      .map(function (p) { return migratePeptide(p, date); })
      .filter(Boolean);
    const checkin = migrateCheckin(legacyRec);

    state.records[date] = { date: date, meals: meals, peptides: peptides, checkin: checkin };
    migratedDays++;
  });

  if (migratedDays > 0) {
    save();
    console.log('[tracker-v6] migrateFromV5: migrated ' + migratedDays + ' day(s) from "' + sourceKey + '"');
  } else {
    console.log('[tracker-v6] migrateFromV5: source "' + sourceKey + '" had no new days to migrate');
  }
  return migratedDays;
}

      meals.push({
        name: mealNames[j % 4],
        items: [{foodId: 'pollo', gramos_crudo: 150 + Math.random() * 100}],
        prot: 35 + Math.random() * 20,
        carb: 40 + Math.random() * 30,
        fat: 15 + Math.random() * 10,
        kcal: 550 + Math.random() * 300
      });
    }

    // 60% chance of check-in (weight logging)
    const checkin = Math.random() > 0.4 ? {
      water: 2.5 + Math.random() * 1.5,
      sleep: 7 + Math.random() * 2,
      quality: ['poor', 'avg', 'good', 'excellent'][Math.floor(Math.random() * 4)],
      weight: weight,
      notes: ''
    } : null;

    // 30% chance of peptide injection
    const peptides = Math.random() > 0.7 ? [{
      id: ['PT-141', 'CJC', 'MOTS-C'][Math.floor(Math.random() * 3)],
      dose: Math.floor(Math.random() * 10) + 50,
      time: '07:00'
    }] : [];

    state.records[dateStr] = { date: dateStr, meals, checkin, peptides };
  }
  save();
  console.log('[tracker-v6] seeded 30 days of demo data');
}

// --------------------------------------------------------------------------
// MEDICATIONS WITH REMINDERS (Task: Doctor Prescription Import)
// Imports doctor-prescribed medications from JSON, creates recurring doses,
// schedules Service Worker notifications, manages "Tomas de hoy" UI.
// --------------------------------------------------------------------------

// importDoctorMedications(medicationsArray) → batch import of doctor-prescribed
// medications into state, keyed by medication ID. Creates recurring dose entries
// for today through fecha_fin based on horarios schedule. Schedules Service
// Worker notifications and updates "Tomas de hoy" display.
function importDoctorMedications(medicationsArray) {
  if (!medicationsArray || !Array.isArray(medicationsArray)) return;

  // Initialize medications registry if not present
  if (!state.medications) state.medications = {};

  const todayDate = today();
  medicationsArray.forEach(med => {
    if (!med.id || !med.nombre) return;

    // Validate active dates
    const fechaInicio = med.fecha_inicio || todayDate;
    const fechaFin = med.fecha_fin || null;

    // Skip if today is before start or after end
    if (todayDate < fechaInicio) return;
    if (fechaFin && todayDate > fechaFin) return;

    // Store medication metadata in state.medications
    state.medications[med.id] = {
      id: med.id,
      nombre: med.nombre,
      dosis: med.dosis,
      frecuencia: med.frecuencia,
      duracion_dias: med.duracion_dias,
      fecha_inicio: fechaInicio,
      fecha_fin: fechaFin,
      horarios: med.horarios || [],
      via: med.via || 'oral',
      estado: med.estado || 'activo'
    };

    // Add medication doses to today's record if active
    if (med.estado === 'activo' && med.horarios && Array.isArray(med.horarios)) {
      const dayRec = rec(todayDate);
      if (!dayRec.medications) dayRec.medications = [];

      med.horarios.forEach(hora => {
        // Check if already logged for this hour
        const exists = dayRec.medications.some(m => m.id === med.id + '_' + hora);
        if (!exists) {
          dayRec.medications.push({
            id: med.id + '_' + hora,
            medicationId: med.id,
            nombre: med.nombre,
            dosis: med.dosis,
            frecuencia: med.frecuencia,
            horarios: med.horarios,
            fecha_inicio: fechaInicio,
            fecha_fin: fechaFin,
            via: med.via || 'oral',
            estado: 'pendiente', // pending, taken, missed
            horario: hora,
            timestamp: null
          });
        }
      });
    }
  });

  save();
  scheduleNotificationsForToday();
  if (typeof render === 'function') render();
}

// scheduleNotificationsForToday() → registers Service Worker notifications
// for each medication dose scheduled for today.
function scheduleNotificationsForToday() {
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return;

  const todayDate = today();
  const dayRec = rec(todayDate);
  if (!dayRec.medications || dayRec.medications.length === 0) return;

  // Request notification permission if not already granted
  if (Notification.permission === 'default') {
    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        scheduleNotificationsForToday();
      }
    });
    return;
  }

  // Schedule notifications for each dose
  dayRec.medications.forEach(med => {
    if (med.estado === 'tomado' || !med.horario) return;

    const [h, m] = med.horario.split(':').map(Number);
    const now = new Date();
    const notifTime = new Date();
    notifTime.setHours(h, m, 0, 0);

    // Only schedule if time hasn't passed yet
    if (notifTime > now) {
      const delayMs = notifTime.getTime() - now.getTime();
      setTimeout(() => {
        if (Notification.permission === 'granted') {
          new Notification('Medicamento · ' + med.horario, {
            tag: med.id,
            requireInteraction: true,
            body: 'Toma: ' + med.nombre + ' · ' + med.dosis + ' · Vía ' + med.via,
            icon: '/tracker/icon-192.png',
            data: { medicationId: med.medicationId, horario: med.horario }
          });
        }
      }, delayMs);
    }
  });
}

// autodeactivateMedications() → daily check: deactivate medications where
// today > fecha_fin. Called on app startup and periodically.
function autodeactivateMedications() {
  const todayDate = today();
  if (!state.medications) return;

  Object.keys(state.medications).forEach(medId => {
    const med = state.medications[medId];
    if (med.fecha_fin && todayDate > med.fecha_fin && med.estado === 'activo') {
      med.estado = 'finalizado';
      // Remove from today's record as well
      const dayRec = rec(todayDate);
      if (dayRec.medications) {
        dayRec.medications = dayRec.medications.filter(m => m.medicationId !== medId);
      }
    }
  });

  save();
}

// getTtomasDeHoy() → returns array of today's medication doses sorted by hora,
// formatted for UI display. Includes metadata for checkbox binding.
function getTtomasDeHoy() {
  const todayDate = today();
  const dayRec = rec(todayDate);
  if (!dayRec.medications || dayRec.medications.length === 0) return [];

  // Sort by hora (HH:MM)
  const sorted = (dayRec.medications || []).slice().sort((a, b) => {
    const [ah] = a.horario.split(':').map(Number);
    const [bh] = b.horario.split(':').map(Number);
    return ah - bh;
  });

  return sorted;
}

// markMedicationTaken(medicationId, hora) → mark a specific dose as taken,
// record timestamp, persist.
function markMedicationTaken(medicationId, hora) {
  const todayDate = today();
  const dayRec = rec(todayDate);
  if (!dayRec.medications) return;

  const med = dayRec.medications.find(m => m.id === medicationId + '_' + hora);
  if (med) {
    med.estado = 'tomado';
    med.timestamp = new Date().toISOString();
    save();
    if (typeof render === 'function') render();
  }
}

// markMedicationUntaken(medicationId, hora) → toggle back to pending.
function markMedicationUntaken(medicationId, hora) {
  const todayDate = today();
  const dayRec = rec(todayDate);
  if (!dayRec.medications) return;

  const med = dayRec.medications.find(m => m.id === medicationId + '_' + hora);
  if (med) {
    med.estado = 'pendiente';
    med.timestamp = null;
    save();
    if (typeof render === 'function') render();
  }
}

// tomasDehoyHtml() → renders "Tomas de hoy" card for dashboard with all
// scheduled doses, checkboxes, and edit/delete actions.
function tomasDehoyHtml() {
  const tomas = getTtomasDeHoy();
  const viewDate = currentDate || today();

  if (tomas.length === 0) {
    return '' +
      '<div class="card">' +
        '<div class="card-header"><h3>Tomas de hoy</h3></div>' +
        '<div class="banner info text-center">Sin medicamentos programados para hoy</div>' +
      '</div>';
  }

  const itemsHtml = tomas.map(function (toma) {
    const hora = toma.horario || '';
    const isChecked = toma.estado === 'tomado';
    const checkboxId = 'med_' + toma.medicationId + '_' + toma.horario;
    return '' +
      '<div class="list-item" style="align-items:flex-start;">' +
        '<input type="checkbox" id="' + checkboxId + '" ' + (isChecked ? 'checked' : '') + ' ' +
          'onchange="if(this.checked) markMedicationTaken(\'' + esc(toma.medicationId) + '\', \'' + esc(toma.horario) + '\'); ' +
          'else markMedicationUntaken(\'' + esc(toma.medicationId) + '\', \'' + esc(toma.horario) + '\');" ' +
          'style="margin-right:var(--space-2); margin-top:2px; width:20px; height:20px; cursor:pointer;">' +
        '<label for="' + checkboxId + '" style="flex:1; cursor:pointer;">' +
          '<div class="item-main">' +
            '<div class="item-title" style="' + (isChecked ? 'opacity:0.6;text-decoration:line-through;' : '') + '">' +
              hora + ' — ' + esc(toma.nombre) + '</div>' +
            '<div class="item-sub">' + esc(toma.dosis) + ' · Vía ' + esc(toma.via) + '</div>' +
          '</div>' +
        '</label>' +
      '</div>';
  }).join('');

  return '' +
    '<div class="card">' +
      '<div class="card-header"><h3>Tomas de hoy · ' + esc(viewDate) + '</h3><span class="badge primary">' + tomas.length + '</span></div>' +
      itemsHtml +
    '</div>';
}
