<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <link rel="manifest" href="/tracker/tracker-manifest.json">
  <link rel="icon" href="/tracker/icon-192.png">
  <title>RB Tracker v6.0 - Elite Protocol</title>
  <style>
  /* ==========================================================================
     TRACKER v6.0 — CSS & LAYOUT (Task 2)
     Mobile-first: base styles target 375px viewport, enhanced at 768px+.
     Theming: CSS custom properties on :root, dark-mode via
     :root[data-theme="dark"] and prefers-color-scheme fallback.
     ========================================================================== */

  /* ---- 1. Theme tokens ---------------------------------------------------- */
  :root {
    /* brand */
    --color-primary: #175cd3;
    --color-primary-hover: #1047a0;
    --color-primary-soft: #e8f0fe;
    --color-accent: #102a43;

    /* semantic */
    --color-success: #1f9d55;
    --color-success-soft: #e3f8ec;
    --color-warning: #b7791f;
    --color-warning-soft: #fdf3d8;
    --color-danger: #d9534f;
    --color-danger-soft: #fbe9e8;

    /* surfaces (light default) */
    --bg: #f4f6f8;
    --bg-elevated: #ffffff;
    --bg-sunken: #eef1f4;
    --bg-header: var(--color-accent);
    --bg-header-text: #ffffff;
    --border: #d9dfe6;
    --border-strong: #b9c2cc;

    /* text */
    --text: #10151a;
    --text-muted: #5b6572;
    --text-faint: #8a95a1;
    --text-on-primary: #ffffff;
    --text-on-dark: #f4f6f8;

    /* macro colors */
    --macro-protein: #175cd3;
    --macro-carb: #1f9d55;
    --macro-fat: #b7791f;
    --macro-kcal: #7c3aed;

    /* layout */
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --touch-target: 44px;
    --shadow-sm: 0 1px 2px rgba(16, 21, 26, 0.08);
    --shadow-md: 0 4px 12px rgba(16, 21, 26, 0.12);
    --shadow-lg: 0 12px 32px rgba(16, 21, 26, 0.24);
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --nav-height: 60px;
    --header-height: auto;
    --transition-fast: 120ms ease;
    --transition-base: 200ms ease;
  }

  /* Dark theme: system preference default, explicit override wins either way */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --bg-elevated: #1e2126;
      --bg-sunken: #101214;
      --border: #2c3138;
      --border-strong: #3a4048;
      --text: #eef1f4;
      --text-muted: #a7b0ba;
      --text-faint: #767f89;
      --color-primary-soft: #16233d;
      --color-success-soft: #10301f;
      --color-warning-soft: #3a2e10;
      --color-danger-soft: #3a1a19;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171a;
    --bg-elevated: #1e2126;
    --bg-sunken: #101214;
    --border: #2c3138;
    --border-strong: #3a4048;
    --text: #eef1f4;
    --text-muted: #a7b0ba;
    --text-faint: #767f89;
    --color-primary-soft: #16233d;
    --color-success-soft: #10301f;
    --color-warning-soft: #3a2e10;
    --color-danger-soft: #3a1a19;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55);
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8;
    --bg-elevated: #ffffff;
    --bg-sunken: #eef1f4;
    --border: #d9dfe6;
    --border-strong: #b9c2cc;
    --text: #10151a;
    --text-muted: #5b6572;
    --text-faint: #8a95a1;
    --color-primary-soft: #e8f0fe;
    --color-success-soft: #e3f8ec;
    --color-warning-soft: #fdf3d8;
    --color-danger-soft: #fbe9e8;
    --shadow-sm: 0 1px 2px rgba(16, 21, 26, 0.08);
    --shadow-md: 0 4px 12px rgba(16, 21, 26, 0.12);
    --shadow-lg: 0 12px 32px rgba(16, 21, 26, 0.24);
  }

  /* ---- 2. Reset & base ----------------------------------------------------- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    max-width: 100vw;
  }
  img, svg { max-width: 100%; display: block; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  a { color: var(--color-primary); }
  ul { list-style: none; }
  h1, h2, h3, h4 { font-weight: 700; line-height: 1.2; }
  h1 { font-size: 19px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  small, .text-sm { font-size: 12px; }

  /* ---- 3. App shell -------------------------------------------------------- */
  #root {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--bg-header);
    color: var(--bg-header-text);
    padding: var(--space-4) var(--space-4)
             calc(var(--space-3) + env(safe-area-inset-bottom, 0px));
    padding-top: calc(var(--space-4) + env(safe-area-inset-top, 0px));
    text-align: center;
    position: relative;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; margin-bottom: var(--space-3); }
  header .subtitle { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }

  .controls {
    display: flex;
    gap: var(--space-2);
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls input[type="date"] {
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: var(--bg-header-text);
    min-height: var(--touch-target);
  }
  .controls button {
    min-height: var(--touch-target);
    padding: var(--space-2) var(--space-4);
    background: rgba(255,255,255,0.12);
    color: var(--bg-header-text);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .controls button:hover { background: rgba(255,255,255,0.2); }

  .theme-toggle {
    position: absolute;
    top: calc(var(--space-3) + env(safe-area-inset-top, 0px));
    right: var(--space-3);
    width: var(--touch-target);
    height: var(--touch-target);
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }

  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: var(--space-4);
    padding-bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px));
  }

  /* Bottom tab navigation (mobile-first: sticky bottom bar) */
  nav#tabs, .tabbar {
    display: flex;
    gap: var(--space-1);
    padding: var(--space-2) var(--space-2) calc(var(--space-2) + env(safe-area-inset-bottom, 0px));
    background: var(--bg-elevated);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    z-index: 20;
  }
  nav#tabs button, .tab-btn {
    flex: 1;
    min-height: var(--touch-target);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: transparent;
    color: var(--text-muted);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 11px;
    cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  nav#tabs button .tab-icon, .tab-btn .tab-icon { font-size: 18px; line-height: 1; }
  nav#tabs button:hover, .tab-btn:hover { background: var(--bg-sunken); }
  nav#tabs button.active, .tab-btn.active { color: var(--color-primary); background: var(--color-primary-soft); }

  /* Segmented tabs (in-page, e.g. filters within a view) */
  .tabs {
    display: flex;
    gap: var(--space-1);
    background: var(--bg-sunken);
    border-radius: var(--radius-md);
    padding: var(--space-1);
    margin-bottom: var(--space-4);
    overflow-x: auto;
  }
  .tabs .tab {
    flex: 1;
    min-height: 36px;
    white-space: nowrap;
    padding: 0 var(--space-3);
    border: none;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .tabs .tab.active { background: var(--bg-elevated); color: var(--color-primary); box-shadow: var(--shadow-sm); }

  /* ---- 4. Buttons ----------------------------------------------------------*/
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: var(--touch-target);
    padding: var(--space-2) var(--space-4);
    background: var(--color-primary);
    color: var(--text-on-primary);
    border: none;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition-fast), transform var(--transition-fast);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: var(--color-primary-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.block { width: 100%; }
  .btn.sm { min-height: 36px; padding: var(--space-1) var(--space-3); font-size: 13px; }
  .btn.lg { min-height: 52px; font-size: 16px; }
  .btn.secondary { background: var(--bg-sunken); color: var(--text); border: 1px solid var(--border); }
  .btn.secondary:hover { background: var(--border); }
  .btn.ghost { background: transparent; color: var(--color-primary); }
  .btn.ghost:hover { background: var(--color-primary-soft); }
  .btn.danger { background: var(--color-danger); color: #fff; }
  .btn.danger:hover { background: #b8433f; }
  .btn.success { background: var(--color-success); color: #fff; }
  .btn.icon-only { width: var(--touch-target); padding: 0; border-radius: 50%; }

  .quick-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-3);
    margin: var(--space-4) 0;
  }
  .quick-actions .btn {
    flex-direction: column;
    height: 76px;
    min-height: 76px;
    font-size: 12px;
    gap: var(--space-1);
  }
  .quick-actions .btn .qa-icon { font-size: 22px; }

  /* ---- 5. Forms -------------------------------------------------------------*/
  .form-group { margin-bottom: var(--space-4); }
  label, .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: var(--space-1);
  }
  input[type="text"],
  input[type="number"],
  input[type="date"],
  input[type="time"],
  input[type="search"],
  textarea,
  select {
    width: 100%;
    min-height: var(--touch-target);
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    font-size: 15px; /* >=16px avoids iOS zoom-on-focus; kept at 15 to match density, safe on modern iOS with viewport-fit */
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }
  select { cursor: pointer; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%), linear-gradient(135deg, var(--text-muted) 50%, transparent 50%); background-position: calc(100% - 20px) center, calc(100% - 15px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: var(--space-6); }
  textarea { min-height: 88px; resize: vertical; font-family: var(--font-mono); font-size: 13px; }

  .form-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
  .form-row > * { flex: 1; min-width: 110px; }
  .form-actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
  .form-actions .btn { flex: 1; }

  .input-group { display: flex; align-items: stretch; }
  .input-group input { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .input-group .input-suffix {
    display: flex; align-items: center; padding: 0 var(--space-3);
    background: var(--bg-sunken); border: 1px solid var(--border); border-left: none;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--text-muted); font-size: 13px;
  }

  .search-box { position: relative; margin-bottom: var(--space-3); }
  .search-box input { padding-left: var(--space-6); }
  .search-box .search-icon { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--text-faint); }

  /* ---- 6. Cards & grid -------------------------------------------------------*/
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
    box-shadow: var(--shadow-sm);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-3);
  }
  .card-header h3 { margin: 0; }
  .card.tight { padding: var(--space-3); }
  .card.accent { border-left: 4px solid var(--color-primary); }

  .grid { display: grid; gap: var(--space-3); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, 1fr); } /* 2-up on mobile, 4-up at 768px */

  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
  .stat-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-3);
  }
  .stat-card .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); margin-bottom: var(--space-1); }
  .stat-card .stat-value { font-size: 22px; font-weight: 700; }
  .stat-card .stat-value .stat-unit { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  .stat-card .stat-target { font-size: 11px; color: var(--text-faint); margin-top: 2px; }
  .stat-card.protein { border-top: 3px solid var(--macro-protein); }
  .stat-card.carb { border-top: 3px solid var(--macro-carb); }
  .stat-card.fat { border-top: 3px solid var(--macro-fat); }
  .stat-card.kcal { border-top: 3px solid var(--macro-kcal); }

  .progress-bar { height: 8px; border-radius: 4px; background: var(--bg-sunken); overflow: hidden; margin-top: var(--space-2); }
  .progress-bar .fill { height: 100%; border-radius: 4px; background: var(--color-primary); transition: width var(--transition-base); }
  .progress-bar .fill.over { background: var(--color-danger); }
  .progress-bar .fill.success { background: var(--color-success); }

  /* ---- 7. Hero (dashboard) ---------------------------------------------------*/
  .hero {
    background: linear-gradient(135deg, var(--color-accent) 0%, var(--color-primary) 100%);
    color: #fff;
    border-radius: var(--radius-lg);
    padding: var(--space-5) var(--space-4);
    margin-bottom: var(--space-4);
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.14), transparent 60%);
    pointer-events: none;
  }
  .hero-phase-badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    background: rgba(255,255,255,0.15);
    padding: var(--space-1) var(--space-3);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: var(--space-3);
  }
  .hero-headline { font-size: 26px; font-weight: 800; margin-bottom: var(--space-1); }
  .hero-subline { font-size: 13px; color: rgba(255,255,255,0.78); margin-bottom: var(--space-4); }
  .hero-ring-row { display: flex; align-items: center; gap: var(--space-4); }
  .hero-ring { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
  .hero-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .hero-ring .ring-track { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 8; }
  .hero-ring .ring-fill { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset var(--transition-base); }
  .hero-ring .ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  .hero-metrics { display: flex; flex-direction: column; gap: var(--space-1); font-size: 13px; }
  .hero-metrics .metric-row { display: flex; justify-content: space-between; gap: var(--space-3); min-width: 160px; }
  .hero-metrics .metric-row .val { font-weight: 700; }

  /* ---- 8. Modals --------------------------------------------------------------*/
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 15, 0.55);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: fadeIn var(--transition-base) ease;
  }
  .modal {
    background: var(--bg-elevated);
    color: var(--text);
    width: 100%;
    max-height: 92vh;
    max-height: 92dvh;
    display: flex;
    flex-direction: column;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: var(--shadow-lg);
    animation: slideUp var(--transition-base) ease;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-4);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-header h2 { font-size: 16px; }
  .modal-close {
    width: var(--touch-target);
    height: var(--touch-target);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-sunken);
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    color: var(--text-muted);
  }
  .modal-body {
    padding: var(--space-4);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
  }
  .modal-footer {
    padding: var(--space-4);
    padding-bottom: calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    display: flex;
    gap: var(--space-2);
    flex-shrink: 0;
  }
  .modal-footer .btn { flex: 1; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }

  /* ---- 9. Lists: meals / peptides / food search -------------------------------*/
  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-3);
    margin-bottom: var(--space-2);
  }
  .list-item .item-main { flex: 1; min-width: 0; }
  .list-item .item-title { font-weight: 600; font-size: 14px; }
  .list-item .item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .list-item .item-meta { text-align: right; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
  .list-item .item-actions { display: flex; gap: var(--space-1); flex-shrink: 0; }
  .list-item .item-actions button {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--bg-sunken); color: var(--text-muted); cursor: pointer;
  }
  .list-item .item-actions button.remove:hover { background: var(--color-danger-soft); color: var(--color-danger); }

  .food-result {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-3);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .food-result:hover, .food-result:active { background: var(--bg-sunken); }
  .food-result:last-child { border-bottom: none; }
  .food-result .food-name { font-weight: 600; font-size: 14px; }
  .food-result .food-macros { font-size: 11px; color: var(--text-muted); }
  .food-result-list { max-height: 45vh; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: var(--space-3); }

  .macro-preview {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-2);
    background: var(--bg-sunken);
    border-radius: var(--radius-md);
    padding: var(--space-3);
    margin: var(--space-3) 0;
    text-align: center;
  }
  .macro-preview .macro-value { font-size: 16px; font-weight: 700; }
  .macro-preview .macro-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

  /* ---- 10. Badges & banners -----------------------------------------------------*/
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px var(--space-2);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    background: var(--bg-sunken);
    color: var(--text-muted);
  }
  .badge.primary { background: var(--color-primary-soft); color: var(--color-primary); }
  .badge.success { background: var(--color-success-soft); color: var(--color-success); }
  .badge.warning { background: var(--color-warning-soft); color: var(--color-warning); }
  .badge.danger { background: var(--color-danger-soft); color: var(--color-danger); }

  .banner {
    padding: var(--space-3);
    border-radius: var(--radius-md);
    margin-bottom: var(--space-3);
    font-size: 13px;
    border: 1px solid transparent;
  }
  .banner.info { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--text); }
  .banner.warn { background: var(--color-warning-soft); border-color: var(--color-warning); color: var(--text); }
  .banner.ok { background: var(--color-success-soft); border-color: var(--color-success); color: var(--text); }
  .banner.danger { background: var(--color-danger-soft); border-color: var(--color-danger); color: var(--text); }

  /* ---- 11. Charts (inline SVG) ----------------------------------------------------*/
  .chart-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); margin-bottom: var(--space-4); }
  .chart-card .chart-title { font-size: 13px; font-weight: 700; margin-bottom: var(--space-1); }
  .chart-card .chart-subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: var(--space-3); }
  .chart-wrap { width: 100%; overflow-x: auto; }
  .chart-wrap svg { width: 100%; height: auto; display: block; }
  .chart-svg .axis-line { stroke: var(--border); stroke-width: 1; }
  .chart-svg .grid-line { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.6; }
  .chart-svg .data-line { fill: none; stroke: var(--color-primary); stroke-width: 2; }
  .chart-svg .data-area { fill: var(--color-primary); opacity: 0.12; }
  .chart-svg .data-point { fill: var(--color-primary); }
  .chart-svg .axis-label { fill: var(--text-faint); font-size: 9px; font-family: var(--font-sans); }
  .chart-svg .value-label { fill: var(--text); font-size: 10px; font-weight: 700; font-family: var(--font-sans); }
  .chart-legend { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-2); font-size: 11px; color: var(--text-muted); }
  .chart-legend .legend-item { display: flex; align-items: center; gap: 4px; }
  .chart-legend .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

     hover tooltips. Min/max bars get a distinct fill so they read at a glance
     alongside the text labels analyticsView() prints above/below the chart. */
  .chart-svg .weight-bar { fill: var(--color-primary); opacity: 0.82; transition: opacity 0.15s ease, fill 0.15s ease; cursor: default; }
  .chart-svg .weight-bar:hover { opacity: 1; fill: var(--color-accent); }
  .chart-svg .weight-bar.is-max { fill: var(--color-warning); }
  .chart-svg .weight-bar.is-min { fill: var(--color-success); }

  /* ---- 12. Tables ------------------------------------------------------------------*/
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: var(--space-4); }

  .data-table tr:hover td { background: var(--bg-sunken); }

  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }

  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-1 { gap: var(--space-1); }
  .gap-2 { gap: var(--space-2); }
  .gap-3 { gap: var(--space-3); }
  .mt-2 { margin-top: var(--space-2); }
  .mt-3 { margin-top: var(--space-3); }
  .mt-4 { margin-top: var(--space-4); }
  .mb-2 { margin-bottom: var(--space-2); }
  .mb-3 { margin-bottom: var(--space-3); }
  .mb-4 { margin-bottom: var(--space-4); }
  .text-center { text-align: center; }
  .text-right { text-align: right; }
  .hidden { display: none !important; }
  .w-full { width: 100%; }
  .empty-state { text-align: center; padding: var(--space-6) var(--space-4); color: var(--text-faint); }
  .empty-state .empty-icon { font-size: 32px; margin-bottom: var(--space-2); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  .fab {
    position: fixed;
    right: var(--space-4);
    bottom: calc(var(--nav-height) + var(--space-4) + env(safe-area-inset-bottom, 0px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--color-primary);
    color: #fff;
    border: none;
    box-shadow: var(--shadow-lg);
    font-size: 24px;
    cursor: pointer;
    z-index: 30;
  }

  /* ---- 14. Scrollbars (desktop refinement, no-op on most mobile browsers) --------*/
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

  /* ---- 15. Responsive: tablet / desktop (>=768px) ---------------------------------*/
  @media (min-width: 768px) {
    body { display: flex; justify-content: center; background: var(--bg-sunken); }
    #root {
      max-width: 480px;
      width: 100%;
      min-height: 100vh;
      box-shadow: var(--shadow-lg);
      background: var(--bg);
    }

    /* Modals become centered dialogs instead of bottom sheets */
    .modal-overlay { align-items: center; padding: var(--space-4); }
    .modal {
      max-width: 420px;
      max-height: 85vh;
      border-radius: var(--radius-lg);
    }

    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .stats-grid { grid-template-columns: repeat(4, 1fr); }

    .hero-headline { font-size: 30px; }
  }

  /* Wider desktop: allow the whole app shell to widen instead of staying phone-sized */
  @media (min-width: 1024px) {
    #root { max-width: 720px; }
    main { padding: var(--space-6); }
    .stats-grid, .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .quick-actions { grid-template-columns: repeat(3, 1fr); max-width: 480px; margin-left: auto; margin-right: auto; }
  }

  /* ---- 16. Reduced motion ----------------------------------------------------------*/
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---- 17. Phase selector & settings (Task 9) ---------------------------------------*/
  .phase-card {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .phase-card:hover { border-color: var(--border-strong); }
  .phase-card.active { border-color: var(--color-primary); box-shadow: 0 0 0 2px var(--color-primary-soft); }
  .phase-card + .phase-card { margin-top: var(--space-3); }

// --------------------------------------------------------------------------
// UTIL FUNCTIONS & HELPERS (Task 3)
// --------------------------------------------------------------------------

// n(x) → coerce any value to a finite number, defaulting to 0.
function n(x) {
  const v = Number(x);
  return Number.isFinite(v) ? v : 0;
}

// esc(x) → escape HTML special chars for safe display (prevents injection
// when interpolating user-entered text — notes, food names, etc. — into
// innerHTML strings in later tasks).
function esc(x) {
  return String(x).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// today() → ISO date string (YYYY-MM-DD) for "right now", adjusted for the
// local timezone offset so it reflects the user's local calendar day
// rather than the UTC day (plain `new Date().toISOString()` would drift
// to the wrong date near midnight in negative-UTC-offset timezones).
function today() {
  const d = new Date();
  const localMs = d.getTime() - d.getTimezoneOffset() * 60000;
  return new Date(localMs).toISOString().slice(0, 10);
}

// blank(date) → fresh day record shape. Internal helper used by rec();
// not part of Task 3's Step 1 function list but needed so rec() has a
// concrete, reusable shape to create when a date has no record yet.
function blank(date) {
  return { date: date, meals: [], peptides: [], checkin: null };
}

// rec(date) → get the record for `date` (defaults to today()) from
// state.records, creating a blank one first if it doesn't exist yet.
function rec(date) {
  date = date || today();
  if (!state.records[date]) {
    state.records[date] = blank(date);
  }
  return state.records[date];
}

// save() → persist the whole app state to localStorage under the v6 key.
function save() {
  try {
    localStorage.setItem('rb_tracker_v6', JSON.stringify(state));
  } catch (e) {
    console.error('[tracker-v6] save() failed', e);
  }
  return state;
}

// totals(meals) → sum {prot, carb, fat, kcal} across an array of meal-like
// objects (each already carrying its own macro totals). Defaults to
// today's logged meals when called with no argument.
function totals(meals) {
  meals = meals || rec().meals || [];
  return meals.reduce(function (acc, m) {
    acc.prot += n(m.prot);
    acc.carb += n(m.carb);
    acc.fat += n(m.fat);
    acc.kcal += n(m.kcal);
    return acc;
  }, { prot: 0, carb: 0, fat: 0, kcal: 0 });
}

// getMacrosByWeight(foodId, grams, isCocido) → macros for a given weight
// of a FOOD_DB item. `grams` is interpreted as raw ("crudo") weight by
// default; when isCocido is true, `grams` is cooked weight and is first
// converted back to its raw equivalent via factor_cocido_sobre_crudo
// (cooked_grams / factor = raw_grams) before applying the food's
// crudo_100g macro rates. Values are rounded to 1 decimal place.
function getMacrosByWeight(foodId, grams, isCocido) {
  isCocido = isCocido || false;
  const food = FOOD_DB.find(function (f) { return f.id === foodId; });
  if (!food) return { prot: 0, carb: 0, fat: 0, kcal: 0 };

  const gramsCrudo = isCocido ? n(grams) / food.factor_cocido_sobre_crudo : n(grams);
  const ratio = gramsCrudo / 100;
  const base = food.crudo_100g;
  const round1 = function (x) { return Math.round(x * 10) / 10; };

  return {
    prot: round1(base.prot * ratio),
    carb: round1(base.carb * ratio),
    fat: round1(base.grasa * ratio),
    kcal: round1(base.kcal * ratio)
  };
}

// Local UI state for the currently-open meal modal. Reset every time the

// mealBuilderModal() → HTML string for the full modal (overlay + panel).
// Renders: quick meal-template chips, a food <select> (32 FOOD_DB entries,
// alphabetized — native <select> gives free keyboard-typeahead/autocomplete),
// a weight input, a Crudo/Cocido toggle button, a live macros preview card,
// and a footer with Cancel / "Agregar a hoy" submit.
function mealBuilderModal() {
  const foodOptions = FOOD_DB
    .slice()
    .sort(function (a, b) { return a.nombre.localeCompare(b.nombre, 'es'); })
    .map(function (f) { return '<option value="' + esc(f.id) + '">' + esc(f.nombre) + '</option>'; })
    .join('');

  const templateChips = MEAL_TEMPLATES
    .map(function (t) {
      // Chip label: short code before the " · " separator (e.g. "D1", "P3").
      const shortLabel = t.name.split(' · ')[0];
      return '<button type="button" class="btn secondary sm" style="white-space:nowrap" ' +
        'onclick="addMealTemplate(\'' + esc(t.id) + '\')" title="' + esc(t.name) + '">' +
        esc(shortLabel) + '</button>';
    })
    .join('');

  return '' +
    '<div class="modal-overlay" id="mealModalOverlay" onclick="if(event.target===this) closeMeal()">' +
      '<div class="modal active" id="mealModal" role="dialog" aria-modal="true" aria-labelledby="mealModalTitle">' +
        '<div class="modal-header">' +
          '<h2 id="mealModalTitle">Agregar comida</h2>' +
          '<button type="button" class="modal-close" onclick="closeMeal()" aria-label="Cerrar">&times;</button>' +

        '<div class="modal-body">' +
          '<div class="form-group">' +
            '<label>Plantillas rápidas</label>' +
            '<div class="flex gap-2" style="overflow-x:auto; padding-bottom:4px;">' + templateChips + '</div>' +
          '</div>' +

          '<div class="banner info text-center">o construye tu propia comida</div>' +

          '<form id="mealForm">' +
            '<div class="form-group">' +
              '<label for="foodSelect">Alimento</label>' +
              '<select id="foodSelect" required>' +
                '<option value="" disabled selected>Selecciona un alimento…</option>' +
                foodOptions +
              '</select>' +
            '</div>' +

            '<div class="form-row">' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label for="mealWeight">Peso (g)</label>' +
                '<input type="number" id="mealWeight" inputmode="decimal" min="1" step="1" placeholder="220" required>' +
              '</div>' +
              '<div class="form-group" style="margin-bottom:0;">' +
                '<label>&nbsp;</label>' +
                '<button type="button" class="btn secondary block" id="crudoCocidoToggle" onclick="toggleRaw()">Crudo</button>' +
              '</div>' +
            '</div>' +

            '<div class="macro-preview" id="macrosPreview">' +
              '<div><div class="macro-value" id="previewProt">0g</div><div class="macro-label">Prot</div></div>' +
              '<div><div class="macro-value" id="previewCarb">0g</div><div class="macro-label">Carb</div></div>' +
              '<div><div class="macro-value" id="previewFat">0g</div><div class="macro-label">Grasa</div></div>' +
              '<div><div class="macro-value" id="previewKcal">0</div><div class="macro-label">Kcal</div></div>' +
            '</div>' +
          '</form>' +
        '</div>' +
        '<div class="modal-footer">' +
          '<button type="button" class="btn secondary" onclick="closeMeal()">Cancelar</button>' +
          '<button type="submit" form="mealForm" class="btn">Agregar a hoy</button>' +
        '</div>' +
      '</div>' +

}

// openMealModal() → inserts mealBuilderModal() into the DOM and wires its
// listeners. This is the glue future quick-action buttons (Task 6) will
// call; kept here so Task 4 is testable end-to-end on its own.
function openMealModal() {
  mealBuilderState = { isCocido: false };
  closeMeal(); // remove any stale instance first
  document.body.insertAdjacentHTML('beforeend', mealBuilderModal());
  attachMealModalListeners();
}

// attachMealModalListeners() → form submit, select change, weight input.
function attachMealModalListeners() {
  const form = document.getElementById('mealForm');
  const select = document.getElementById('foodSelect');
  const weight = document.getElementById('mealWeight');
  if (form) form.addEventListener('submit', handleMealSubmit);
  if (select) select.addEventListener('change', updateMacrosPreview);
  if (weight) weight.addEventListener('input', updateMacrosPreview);
}

// toggleRaw() → flips the Crudo/Cocido interpretation of the weight input,
// relabels the toggle button, and recomputes the live preview.
function toggleRaw() {
  mealBuilderState.isCocido = !mealBuilderState.isCocido;
  const btn = document.getElementById('crudoCocidoToggle');
  if (btn) btn.textContent = mealBuilderState.isCocido ? 'Cocido' : 'Crudo';
  updateMacrosPreview();
}

// updateMacrosPreview() → reads the current food select + weight input,
// computes macros via getMacrosByWeight(), writes them into the preview card.
function updateMacrosPreview() {
  const select = document.getElementById('foodSelect');
  const weightInput = document.getElementById('mealWeight');
  const foodId = select ? select.value : '';
  const grams = weightInput ? n(weightInput.value) : 0;
  const macros = (foodId && grams > 0)
    ? getMacrosByWeight(foodId, grams, mealBuilderState.isCocido)
    : { prot: 0, carb: 0, fat: 0, kcal: 0 };

  const setText = function (id, val) {
    const el = document.getElementById(id);
    if (el) el.textContent = val;
  };
  setText('previewProt', macros.prot + 'g');
  setText('previewCarb', macros.carb + 'g');
  setText('previewFat', macros.fat + 'g');
  setText('previewKcal', Math.round(macros.kcal));
}

// closeMeal() → removes the modal overlay from the DOM, if present.
function closeMeal() {
  const overlay = document.getElementById('mealModalOverlay');
  if (overlay) overlay.remove();
}

// addMealTemplate(templateId) → looks up a MEAL_TEMPLATES entry and appends
// it (with its precomputed exact totals) to today's rec().meals, persists,
// closes the modal, and re-renders if the main render loop (Task 8) exists.
function addMealTemplate(templateId) {
  const tpl = MEAL_TEMPLATES.find(function (t) { return t.id === templateId; });
  if (!tpl) return;

  const meal = {
    id: 'm_' + Date.now(),
    name: tpl.name,
    templateId: tpl.id,
    items: tpl.items,
    prot: tpl.totals.prot,
    carb: tpl.totals.carb,
    fat: tpl.totals.fat,
    kcal: tpl.totals.kcal,
    timestamp: new Date().toISOString()
  };
  rec().meals.push(meal);
  save();
  closeMeal();
  if (typeof render === 'function') render();
}

// handleMealSubmit(e) → reads the custom-weight form, computes macros for
// the selected food + weight + crudo/cocido state, appends a meal to
// today's rec().meals, persists, closes the modal, and re-renders if the
// main render loop (Task 8) exists.
function handleMealSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();

  const select = document.getElementById('foodSelect');
  const weightInput = document.getElementById('mealWeight');
  const foodId = select ? select.value : '';
  const grams = weightInput ? n(weightInput.value) : 0;
  const food = FOOD_DB.find(function (f) { return f.id === foodId; });
  if (!food || grams <= 0) return;

  const isCocido = mealBuilderState.isCocido;
  const macros = getMacrosByWeight(foodId, grams, isCocido);

  const meal = {
    id: 'm_' + Date.now(),
    name: food.nombre + ' (' + grams + 'g ' + (isCocido ? 'cocido' : 'crudo') + ')',
    foodId: food.id,
    gramos: grams,
    isCocido: isCocido,
    prot: macros.prot,
    carb: macros.carb,
    fat: macros.fat,
    kcal: macros.kcal,
    timestamp: new Date().toISOString()
  };
  rec().meals.push(meal);
  save();
  closeMeal();
  if (typeof render === 'function') render();
}

// macroPct(consumed, target) → integer percent, 0 when target is falsy.
function macroPct(consumed, target) {
  if (!target) return 0;
  return Math.round((consumed / target) * 100);
}

// ringMarkup(pct) → SVG progress ring used at the top of every phase's
// hero. `pct` is clamped to [0,100] for the ring's own fill (it can
// legitimately exceed 100% in the surrounding text — the ring just tops
// out visually).
function ringMarkup(pct) {
  const clamped = Math.max(0, Math.min(100, n(pct)));
  const r = 38;
  const c = 2 * Math.PI * r;
  const offset = c - (clamped / 100) * c;
  return '' +
    '<div class="hero-ring">' +
      '<svg viewBox="0 0 88 88">' +
        '<circle class="ring-track" cx="44" cy="44" r="' + r + '"></circle>' +
        '<circle class="ring-fill" cx="44" cy="44" r="' + r + '" ' +
          'style="stroke-dasharray:' + c.toFixed(1) + ';stroke-dashoffset:' + offset.toFixed(1) + '"></circle>' +
      '</svg>' +
      '<div class="ring-label">' + Math.round(n(pct)) + '%</div>' +
    '</div>';
}

// heroAnabolismo(t, targets) → kcal-% focused hero (per plan: "Anabolismo: kcal%").
function heroAnabolismo(t, targets) {
  const pct = macroPct(t.kcal, targets.calories);
  return '' +
    '<div class="hero-headline">' + t.kcal.toFixed(0) + ' / ' + targets.calories + ' kcal</div>' +
    '<div class="hero-subline">Fase de construcción muscular — superávit controlado</div>' +
    '<div class="hero-ring-row">' +
      ringMarkup(pct) +
      '<div class="hero-metrics">' +
        '<div class="metric-row"><span>Proteína</span><span class="val">' + t.prot.toFixed(0) + 'g / ' + targets.protein + 'g</span></div>' +
        '<div class="metric-row"><span>Carbos</span><span class="val">' + t.carb.toFixed(0) + 'g / ' + targets.carbs + 'g</span></div>' +
        '<div class="metric-row"><span>Grasa</span><span class="val">' + t.fat.toFixed(0) + 'g / ' + targets.fat + 'g</span></div>' +
      '</div>' +
    '</div>';
}

// getWeightHistory() → all {date, weight} pairs recorded via check-in,
// sorted ascending by date. Used by the Retatrutida hero's trend line;
// full charting is Task 7's job — this just needs "latest vs previous".
function getWeightHistory() {
  return Object.keys(state.records)
    .filter(function (d) { return state.records[d].checkin && state.records[d].checkin.weight != null; })
    .sort()
    .map(function (d) { return { date: d, weight: n(state.records[d].checkin.weight) }; });
}

// heroRetatrutida(t, targets) → weight-trend focused hero (per plan:
// "Retatrutida: weight trend").
function heroRetatrutida(t, targets) {
  const hist = getWeightHistory();
  const latest = hist.length ? hist[hist.length - 1] : null;
  const prev = hist.length > 1 ? hist[hist.length - 2] : null;
  const pct = macroPct(t.kcal, targets.calories);

  let trendHtml;
  if (latest) {
    const delta = prev ? (latest.weight - prev.weight) : 0;
    const arrow = delta < 0 ? '&darr;' : (delta > 0 ? '&uarr;' : '&rarr;');
    const deltaColor = delta <= 0 ? '#8fe3b0' : '#ffb4b0';
    trendHtml = '' +
      '<div class="hero-headline">' + latest.weight.toFixed(1) + ' kg</div>' +
      '<div class="hero-subline">' +
        (prev
          ? ('<span style="color:' + deltaColor + '">' + arrow + ' ' + Math.abs(delta).toFixed(1) + ' kg</span> vs. check-in anterior')
          : 'Primer registro de peso — sigue haciendo check-in para ver la tendencia') +
      '</div>';
  } else {
    trendHtml = '' +
      '<div class="hero-headline">Sin registros de peso</div>' +
      '<div class="hero-subline">Añade tu primer check-in para ver la tendencia</div>';
  }

  return '' +
    trendHtml +
    '<div class="hero-ring-row">' +
      ringMarkup(pct) +
      '<div class="hero-metrics">' +
        '<div class="metric-row"><span>Kcal hoy</span><span class="val">' + t.kcal.toFixed(0) + ' / ' + targets.calories + '</span></div>' +
        '<div class="metric-row"><span>Proteína</span><span class="val">' + t.prot.toFixed(0) + 'g / ' + targets.protein + 'g</span></div>' +
        '<div class="metric-row"><span>Carbos</span><span class="val">' + t.carb.toFixed(0) + 'g / ' + targets.carbs + 'g</span></div>' +
      '</div>' +
    '</div>';
}

// getLastMealTimestamp() → epoch ms of the most recent logged meal across
// *all* recorded days (not just the viewed one), or null if none exist yet.
function getLastMealTimestamp() {
  let last = null;
  Object.keys(state.records).forEach(function (d) {
    (state.records[d].meals || []).forEach(function (m) {
      if (m.timestamp) {
        const ts = new Date(m.timestamp).getTime();
        if (!last || ts > last) last = ts;
      }
    });
  });
  return last;
}

// formatDuration(ms) → "HH:MM" elapsed, floored to the minute.
function formatDuration(ms) {
  const totalMin = Math.max(0, Math.floor(ms / 60000));
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

// heroPurga(t, targets) → fasting-timer focused hero (per plan: "Purga:
// ayuno timer").
function heroPurga(t, targets) {
  const lastTs = getLastMealTimestamp();
  const elapsed = lastTs != null ? (Date.now() - lastTs) : null;
  const pct = macroPct(t.kcal, targets.calories);

  const timerHtml = elapsed != null
    ? '<div class="hero-headline">' + formatDuration(elapsed) + '</div><div class="hero-subline">En ayuno desde la última comida registrada</div>'
    : '<div class="hero-headline">00:00</div><div class="hero-subline">Registra tu primera comida para iniciar el temporizador de ayuno</div>';

  return '' +
    timerHtml +
    '<div class="hero-ring-row">' +
      ringMarkup(pct) +
      '<div class="hero-metrics">' +
        '<div class="metric-row"><span>Kcal hoy</span><span class="val">' + t.kcal.toFixed(0) + ' / ' + targets.calories + '</span></div>' +
        '<div class="metric-row"><span>Carbos</span><span class="val">' + t.carb.toFixed(0) + 'g / ' + targets.carbs + 'g</span></div>' +
        '<div class="metric-row"><span>Proteína</span><span class="val">' + t.prot.toFixed(0) + 'g / ' + targets.protein + 'g</span></div>' +
      '</div>' +
    '</div>';
}

  const statCard = function (label, cls, consumed, target, unit) {

    '</div>';

  const meals = day.meals || [];

        return '' +

  const mealListSection = '' +

      '<div class="card-header"><h3>Comidas &middot; ' + esc(currentDate) + '</h3><span class="badge primary">' + meals.length + '</span></div>' +

// delMeal(index) → removes a single meal from the currently viewed day's
// rec().meals by its position in the array (matches the index used when
// mealItemsHtml was built in dashboard() above), persists, and re-renders.
function delMeal(index) {
  const day = rec(currentDate);
  if (!day.meals || index < 0 || index >= day.meals.length) return;
  day.meals.splice(index, 1);
  save();
  if (typeof render === 'function') render();
}

// --------------------------------------------------------------------------
// ANALYTICS VIEW — SVG CHARTS (Task 7)
// Consumes: state.records, totals(), PROTOCOLS/state.macroTargets, esc(),
//           n(), today(), currentDate, getWeightHistory() (Task 6 helper —
//           already returns ascending {date, weight} pairs from
//           checkin.weight, reused here instead of re-deriving it).
// Produces: weightChart(days), macrosChart(), analyticsView()
// Glue (not in the task's named-function list, but needed for local-
// timezone-safe date-range math, mirroring shiftDate()/today()):
// addDaysISO(dateStr, delta)
// --------------------------------------------------------------------------

// addDaysISO(dateStr, delta) → dateStr shifted by `delta` days using the
// same local-midnight-safe math as shiftDate()/today(), so the 90-day/
// 7-day chart windows below never drift a day near midnight in
// negative-UTC-offset timezones.
function addDaysISO(dateStr, delta) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  const localMs = d.getTime() - d.getTimezoneOffset() * 60000;
  return new Date(localMs).toISOString().slice(0, 10);
}

// weightChart(days) → SVG bar chart of logged body weight over the last
// `days` days (default 90), anchored on currentDate. Renders one <rect>
// per day that actually has a checkin.weight entry — sparse real-world
// logging reads better as evenly-spaced bars than as a mostly-empty daily
// grid. Min/max values are printed on the chart and their bars get a
// distinct color; every bar also carries a native SVG <title> so hovering
// shows "dd/mm: Xkg" without any extra JS/event wiring.
function weightChart(days) {
  days = days || 90;
  const endDate = currentDate || today();
  const startDate = addDaysISO(endDate, -(days - 1));

  const entries = getWeightHistory().filter(function (e) {
    return e.date >= startDate && e.date <= endDate;
  });

  if (!entries.length) {
    return '' +
      '<div class="chart-card">' +
        '<div class="chart-title">Peso corporal</div>' +
        '<div class="chart-subtitle">Últimos ' + days + ' días</div>' +
        '<div class="empty-state">' +
          '<div class="empty-icon">&#9878;</div>' +
          '<div>Sin registros de peso todavía. Usa el check-in diario para empezar tu tendencia.</div>' +
        '</div>' +
      '</div>';
  }

  const weights = entries.map(function (e) { return e.weight; });
  const min = Math.min.apply(null, weights);
  const max = Math.max.apply(null, weights);
  const range = Math.max(max - min, 1); // avoid div-by-zero on a flat week

  const W = 700, H = 220, padTop = 26, padBottom = 36, padLeft = 6, padRight = 6;
  const chartH = H - padTop - padBottom;
  const chartW = W - padLeft - padRight;
  const slot = chartW / entries.length;
  const barW = Math.max(2, slot - 2);

  const fmtDate = function (d) {
    const parts = d.split('-');
    return parts[2] + '/' + parts[1];
  };

  const bars = entries.map(function (e, i) {
    const x = padLeft + i * slot + (slot - barW) / 2;
    const ratio = (e.weight - min) / range;
    const barH = Math.max(2, ratio * chartH);
    const y = padTop + (chartH - barH);
    const cls = 'weight-bar' + (e.weight === max ? ' is-max' : '') + (e.weight === min ? ' is-min' : '');
    return '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
      '" width="' + barW.toFixed(1) + '" height="' + barH.toFixed(1) + '" rx="1.5">' +
        '<title>' + esc(fmtDate(e.date)) + ': ' + e.weight + ' kg</title>' +
      '</rect>';
  }).join('');

  const delta = entries[entries.length - 1].weight - entries[0].weight;
  const deltaLabel = (delta > 0 ? '+' : '') + delta.toFixed(1) + ' kg';
  const deltaClass = delta > 0 ? 'danger' : (delta < 0 ? 'success' : '');

  return '' +
    '<div class="chart-card">' +
      '<div class="card-header">' +
        '<div>' +
          '<div class="chart-title">Peso corporal</div>' +
          '<div class="chart-subtitle">Últimos ' + days + ' días &middot; ' + entries.length + ' registros</div>' +
        '</div>' +
        '<span class="badge ' + deltaClass + '">' + esc(deltaLabel) + '</span>' +
      '</div>' +
      '<div class="chart-wrap">' +
        '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
          '<text class="value-label" x="' + padLeft + '" y="12">Max ' + max + ' kg</text>' +
          '<line class="axis-line" x1="' + padLeft + '" y1="' + (padTop + chartH) + '" x2="' + (W - padRight) + '" y2="' + (padTop + chartH) + '"/>' +
          bars +
          '<text class="value-label" x="' + padLeft + '" y="' + (padTop + chartH + 14) + '">Min ' + min + ' kg</text>' +
          '<text class="axis-label" x="' + padLeft + '" y="' + (H - 4) + '">' + esc(fmtDate(entries[0].date)) + '</text>' +
          '<text class="axis-label" x="' + (W - padRight) + '" y="' + (H - 4) + '" text-anchor="end">' + esc(fmtDate(entries[entries.length - 1].date)) + '</text>' +
        '</svg>' +
      '</div>' +
    '</div>';
}

// macrosChart() → 7-day (anchored on currentDate) average P/C/G vs. the
// active phase's targets, as three progress-bar stat cards. Averages
// divide by 7 regardless of how many of those days actually have meals
// logged, so a week with gaps honestly shows a lower average rather than
// only counting logged days.
function macrosChart() {
  const days = 7;
  const endDate = currentDate || today();

  const sums = { prot: 0, carb: 0, fat: 0 };
  for (let i = 0; i < days; i++) {
    const d = addDaysISO(endDate, -i);
    const day = state.records[d];
    const t = totals(day ? day.meals : []);
    sums.prot += t.prot;
    sums.carb += t.carb;
    sums.fat += t.fat;
  }
  const avg = {
    prot: sums.prot / days,
    carb: sums.carb / days,
    fat: sums.fat / days
  };

  const target = state.macroTargets || PROTOCOLS[state.selectedPhase].targets;

  const macroCard = function (cls, label, value, targetVal) {
    const pct = targetVal > 0 ? Math.round((value / targetVal) * 100) : 0;
    const fillClass = pct > 110 ? 'over' : (pct >= 90 ? 'success' : '');
    return '' +
      '<div class="stat-card ' + cls + '">' +
        '<div class="stat-label">' + esc(label) + '</div>' +
        '<div class="stat-value">' + Math.round(value) + '<span class="stat-unit">g</span></div>' +
        '<div class="stat-target">Meta ' + Math.round(targetVal) + 'g &middot; ' + pct + '%</div>' +
        '<div class="progress-bar"><div class="fill ' + fillClass + '" style="width:' + Math.min(pct, 100) + '%"></div></div>' +
      '</div>';
  };

  return '' +
    '<div class="chart-card">' +
      '<div class="chart-title">Macros — promedio 7 días</div>' +
      '<div class="chart-subtitle">vs. objetivos de fase ' + esc(state.selectedPhase) + '</div>' +
      '<div class="grid grid-3">' +
        macroCard('protein', 'Proteína', avg.prot, target.protein) +
        macroCard('carb', 'Carbohidratos', avg.carb, target.carbs) +
        macroCard('fat', 'Grasa', avg.fat, target.fat) +
      '</div>' +
    '</div>';
}

// analyticsView() → full analytics tab: title, 90-day weight bar chart,
// 7-day macros-vs-target comparison, and the 10 most recently logged
// meals across all recorded days. Replaces the Task 8 placeholder; keeps
// the same no-arg/returns-HTML-string signature so render() needs no
// changes.
function analyticsView() {
  const allMeals = [];
  Object.keys(state.records).forEach(function (d) {
    const day = state.records[d];
    (day.meals || []).forEach(function (m) {
      allMeals.push({
        date: d,
        name: m.name,
        prot: n(m.prot),
        carb: n(m.carb),
        fat: n(m.fat),
        kcal: n(m.kcal),
        timestamp: m.timestamp || ''
      });
    });
  });
  allMeals.sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return a.timestamp < b.timestamp ? 1 : -1;
  });
  const last10 = allMeals.slice(0, 10);

  const mealsTable = last10.length
    ? '<div class="table-wrap">' +
        '<table class="data-table">' +
          '<thead><tr><th>Fecha</th><th>Comida</th><th>Prot</th><th>Carb</th><th>Grasa</th><th>Kcal</th></tr></thead>' +
          '<tbody>' +
            last10.map(function (m) {
              return '<tr>' +
                  '<td>' + esc(m.date) + '</td>' +
                  '<td>' + esc(m.name) + '</td>' +
                  '<td>' + Math.round(m.prot) + 'g</td>' +
                  '<td>' + Math.round(m.carb) + 'g</td>' +
                  '<td>' + Math.round(m.fat) + 'g</td>' +
                  '<td>' + Math.round(m.kcal) + '</td>' +
                '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
      '</div>'
    : '<div class="empty-state"><div class="empty-icon">&#127860;</div><div>Aún no hay comidas registradas.</div></div>';

  return '' +
    '<h2 class="mb-3">Analítica</h2>' +
    weightChart(90) +
    macrosChart() +
    '<div class="chart-card">' +
      '<div class="chart-title">Últimas comidas</div>' +
      '<div class="chart-subtitle">10 registros más recientes</div>' +
      mealsTable +
    '</div>';
}
