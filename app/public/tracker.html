    * { margin: 0; padding: 0; box-sizing: border-box; }

    #root { min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #102a43; padding: 16px; text-align: center; border-bottom: 1px solid #333; position: relative; }
    header h1 { font-size: 18px; margin-bottom: 12px; }
    .controls { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .controls input { padding: 8px; font-size: 14px; }
    .controls button { padding: 8px 16px; background: #175cd3; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .controls button:hover { background: #1047a0; }
    .dark-toggle { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; }
    main { flex: 1; overflow-y: auto; padding: 16px; }
    .section { margin-bottom: 16px; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
    .section-header { background: #252525; padding: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #175cd3; }
    .section-header:hover { background: #2a2a2a; }
    .section-body { padding: 12px; display: none; }
    .section-body.open { display: block; }
    .item { background: #1a1a1a; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .stat-box { background: #252525; border: 1px solid #333; padding: 12px; border-radius: 4px; margin-bottom: 8px; }
    .stat-label { font-size: 12px; color: #aaa; }
    .stat-value { font-size: 18px; font-weight: bold; margin-top: 4px; }
    .peptide-item { background: #1a1a1a; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
    .peptide-name { font-weight: bold; margin-bottom: 4px; }
    .peptide-mechanism { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .peptide-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .peptide-controls input { width: 60px; padding: 6px; }
    .status-btn { padding: 6px 12px; background: #f39c12; color: black; border: none; cursor: pointer; border-radius: 3px; font-size: 12px; }
    .status-btn.done { background: #2ecc71; color: white; }
    .status-btn.skipped { background: #95a5a6; color: white; }
    nav { display: flex; gap: 8px; padding: 8px; background: #102a43; border-top: 1px solid #333; flex-wrap: wrap; justify-content: center; overflow-x: auto; }
    nav button { padding: 10px; flex-shrink: 0; background: #1a1a1a; color: #e0e0e0; border: 1px solid #333; cursor: pointer; border-radius: 4px; font-size: 12px; }
    nav button.active { background: #175cd3; color: white; }
    nav button:hover { background: #252525; }
    .btn { padding: 10px 16px; background: #175cd3; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin: 4px 4px 4px 0; }
    .btn.danger { background: #d9534f; }
    .banner { padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
    .banner.warn { background: #4a3b12; border: 1px solid #7a5f1c; color: #ffd77a; }
    .banner.ok { background: #12331f; border: 1px solid #1f5c39; color: #9be3b6; }
    input[type="text"], input[type="number"], textarea, select { background: #111; color: #ddd; border: 1px solid #333; border-radius: 6px; padding: 8px; font-size: 14px; }
    select { cursor: pointer; }
    textarea { width: 100%; min-height: 80px; font-family: monospace; font-size: 12px; }
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .form-row input, .form-row button, .form-row select { flex: 1; min-width: 100px; }
    .muted { font-size: 12px; color: #888; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .history-table th, .history-table td { border: 1px solid #333; padding: 8px; text-align: left; }
    .history-table th { background: #252525; font-weight: bold; }
    .history-table tr:hover { background: #252525; }
    .supp-box { background: #1a1a1a; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
    .supp-label { font-weight: bold; margin-bottom: 6px; font-size: 13px; }
    .supp-input { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .supp-input input { flex: 1; }
    .supp-input .unit { font-size: 12px; color: #aaa; min-width: 40px; }
  </style>

    function normalizeRecords(rawRecords) {
      const out = {};
      if (!rawRecords) return out;
      const entries = Array.isArray(rawRecords)
        ? rawRecords.map(r => [ (r && (r.date || r.day_key || r.day)) , r ])

      entries.forEach(([key, rec]) => {
        if (!rec || typeof rec !== 'object') return;
        const date = rec.date || rec.day_key || rec.day || (/^\d{4}-\d{2}-\d{2}$/.test(key) ? key : null);
        if (!date) return;
        out[date] = {
          date,
          meals: rec.meals || [],
          workouts: rec.workouts || [],
          supplements: rec.supplements || { protein_powder_g: 0, creatine_mg: 0, preworkout_dose: '', vitamins: [], notes: '' },
          hydration: rec.hydration || { liters: 0, notes: '' },
          sleep: rec.sleep || { hours: 0, quality: null, notes: '' },
          recovery: rec.recovery || { soreness: null, hrv: null, notes: '' },
          weight: (rec.weight !== undefined ? rec.weight : null),
          peptides: rec.peptides || [],
          checks: rec.checks || {}
        };
      });
      return out;
    }

    function scanLegacy() {
      const found = {}; const sources = [];
      LEGACY_KEYS.forEach(k => {
        const raw = localStorage.getItem(k);
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          const recs = normalizeRecords(parsed && parsed.records ? parsed.records : parsed);
          const n = Object.keys(recs).length;
          if (n > 0) { Object.assign(found, recs); sources.push(k + ' (' + n + ')'); }
        } catch (e) { }
      });
      return { records: found, sources };
    }

    function loadData() {
      const storedV5 = localStorage.getItem(V5_KEY);
      if (storedV5) {
        try {
          const parsed = JSON.parse(storedV5);
          if (parsed && parsed.records && Object.keys(parsed.records).length > 0) {
            data = parsed;
            data.version = APP_VERSION;
            recoveryNote = '';
            updateTodayRecord();
            return;
          }
        } catch (e) { }
      }
      const scan = scanLegacy();
      data = emptyData();
      if (Object.keys(scan.records).length > 0) {
        data.records = scan.records;
        recoveryNote = '✓ Histórico recuperado: ' + Object.keys(scan.records).length + ' días.';
        persist();
      } else {
        recoveryNote = 'no-data';
      }
      updateTodayRecord();
    }

    function persist() {
      const prev = localStorage.getItem(V5_KEY);
      if (prev) localStorage.setItem(V5_KEY + '_prev', prev);
      localStorage.setItem(V5_KEY, JSON.stringify(data));
    }
    function saveData() { data.syncedAt = Date.now(); persist(); }

    function updateTodayRecord() {
      const today = (document.getElementById('dateInput') && document.getElementById('dateInput').value) || getTodayDateString();
      if (!data.records[today]) data.records[today] = blankRecord(today);
      todayRecord = data.records[today];
    }

    function renderPeptidesTab() {
      [...PEPTIDE_DATA.activos, ...PEPTIDE_DATA.opcionales].forEach(pep => {
        if (!todayRecord.peptides.find(p => p.id === pep.id)) {
          todayRecord.peptides.push({ id: pep.id, label: pep.label, mechanism: pep.mechanism, dosage_protocol: pep.dosage_protocol, dosage_applied: pep.dosage_protocol || 50, status: 'pending', timestamp: null });
        }
      });
      saveData();
      let html = '';
      const diarios = PEPTIDE_DATA.activos.filter(p => p.frequency === 'daily');
      html += group('Diarios (cada día)', diarios, true);
      const semana = PEPTIDE_DATA.activos.filter(p => ['3x_week','2x_week','weekdays_only'].includes(p.frequency));
      html += group('3x/Semana', semana, true);
      const segun = PEPTIDE_DATA.activos.filter(p => p.frequency === 'weekly' || p.frequency === 'on_demand');
      html += group('Según Día', segun, true);
      html += group('Opcionales', PEPTIDE_DATA.opcionales, false);
      return html;
    }

    function group(title, peps, open) {
      let h = '<div class="section"><div class="section-header" onclick="toggleSection(this)">' + title + ' <span>' + (open ? '▼' : '▶') + '</span></div><div class="section-body ' + (open ? 'open' : '') + '">';
      peps.forEach(p => h += renderPeptideItem(p));
      return h + '</div></div>';
    }

    function renderPeptideItem(peptide) {
      let entry = todayRecord.peptides.find(p => p.id === peptide.id);
      if (!entry) { entry = { id: peptide.id, label: peptide.label, mechanism: peptide.mechanism, dosage_protocol: peptide.dosage_protocol, dosage_applied: peptide.dosage_protocol || 50, status: 'pending', timestamp: null }; todayRecord.peptides.push(entry); saveData(); }
      const cls = entry.status === 'done' ? 'done' : entry.status === 'skipped' ? 'skipped' : '';
      const txt = entry.status === 'done' ? 'Done' : entry.status === 'skipped' ? 'Skipped' : 'Pending';
      return `<div class="peptide-item"><div class="peptide-name">${entry.label}</div><div class="peptide-mechanism">${entry.mechanism}</div><div class="peptide-controls"><input type="number" min="1" max="100" value="${entry.dosage_applied}" onchange="updateDosage('${entry.id}', this.value)"><span style="margin-left:-4px;">L</span><button class="status-btn ${cls}" onclick="toggleStatus('${entry.id}')" title="Status: ${txt}">○ ${txt}</button></div></div>`;
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'rb_tracker_backup_' + getTodayDateString() + '.json';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      msg('✓ Respaldo exportado (' + totalRecords() + ' días).');
    }

    function importFromFile(ev) {
      const file = ev.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { handleImportText(reader.result); ev.target.value = ''; };
      reader.readAsText(file);
    }

    function importFromPaste() {
      const t = document.getElementById('pasteBox').value.trim();
      if (!t) { msg('Pega primero el JSON.'); return; }
      handleImportText(t);
    }

    function handleImportText(text) {
      let parsed;
      try { parsed = JSON.parse(text); }
      catch (e) { msg('❌ JSON inválido: ' + e.message); return; }
      const source = parsed && parsed.records ? parsed.records : parsed;
      const recs = normalizeRecords(source);
      const n = Object.keys(recs).length;
      Object.assign(data.records, recs);
      if (parsed.macroTargets) data.macroTargets = parsed.macroTargets;
      saveData();
      msg('✓ Importados ' + n + ' días. Total: ' + totalRecords() + '.');
      updateTodayRecord(); render();
    }

    function retryRecovery() {
      const scan = scanLegacy();
      if (Object.keys(scan.records).length === 0) { msg('No encontrado histórico.'); return; }
      const n = Object.keys(scan.records).length;
      Object.assign(data.records, scan.records);
      saveData();
      msg('✓ Recuperados ' + n + ' días.');
      updateTodayRecord(); render();
    }

    function msg(t) { const el = document.getElementById('datosMsg'); if (el) el.textContent = t; }

    function toggleSection(header) {
      const body = header.nextElementSibling; body.classList.toggle('open');
      header.querySelector('span').textContent = body.classList.contains('open') ? '▼' : '▶';
    }

    function updateDosage(id, value) { const e = todayRecord.peptides.find(p => p.id === id); if (e) { e.dosage_applied = parseInt(value) || 50; saveData(); } }

    function toggleStatus(id) {
      const e = todayRecord.peptides.find(p => p.id === id);
      if (!e) return;
      const s = ['pending','done','skipped']; e.status = s[(s.indexOf(e.status) + 1) % 3];
      e.timestamp = e.status === 'done' ? new Date().toISOString() : null;
      saveData(); render();
    }

    function init() { loadData(); setTodayDate(); render(); }
    init();
  </script>
</body>
</html>
