services:
  - type: web
    name: private-office
    runtime: node
    plan: standard
    buildCommand: cd app && npm install --include=dev && npm run build
    startCommand: cd app && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: private_office_db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
    healthCheckPath: /api/health
    disk:
      name: private-office-disk
      mountPath: /var/data
      sizeGB: 1
