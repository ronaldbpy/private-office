<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>RB Tracker v5 - Elite Nutrition + Peptides</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      -webkit-text-size-adjust: 100%;
    }
    #root { min-height: 100vh; min-height: 100dvh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // ============================================================================
    // CORE MIGRATION FUNCTION
    // ============================================================================
    function migrateLocalStorage() {
      try {
        const v4Data = JSON.parse(localStorage.getItem('rb_tracker_v4') || '{"version":4,"records":{}}');

        if (v4Data.version === 5) {
          return v4Data;
        }

        const v5Data = {
          version: 5,
          records: {},
          macroTargets: {
            protein: 200,
            carbs: 300,
            fat: 80
          },
          peptideProtocol: {
            retatrutida: { label: "Retatrutida", frequency: "weekly", weekday: 2 },
            bpc157_am: { label: "BPC-157 (mañana)", frequency: "daily" },
            bpc157_pm: { label: "BPC-157 (noche)", frequency: "daily" },
            cjc_ipa: { label: "CJC/Ipamorelin", frequency: "daily" },
            ghk_cu: { label: "GHK-Cu", frequency: "weekdays_only" },
            mots_c: { label: "MOTS-C", frequency: "3x_week", weekdays: [1,3,5] },
            nad: { label: "NAD+", frequency: "3x_week", weekdays: [1,3,5] },
            ta1: { label: "Thymosin Alpha-1", frequency: "2x_week", weekdays: [3,5] },
            ss31: { label: "SS-31", frequency: "daily" },
            klow: { label: "KLOW", frequency: "2x_week", weekdays: [3,5] },
            pt141: { label: "PT-141", frequency: "on_demand" },
            semax_selank: { label: "Semax+Selank", frequency: "2x_week", weekdays: [1,4] }
          },
          syncedAt: Date.now()
        };

        Object.entries(v4Data.records || {}).forEach(([date, record]) => {
          v5Data.records[date] = {
            date,
            meals: [],
            workouts: [],
            supplements: { taken: [], notes: '' },
            hydration: { liters: 0, notes: '' },
            sleep: { hours: 0, quality: null, notes: '' },
            recovery: { soreness: null, hrv: null, notes: '' },
            peptides: [], // NEW: empty array for peptides
            checks: record.checks || {}
          };
        });

        localStorage.setItem('rb_tracker_v5', JSON.stringify(v5Data));
        return v5Data;
      } catch (e) {
        console.error('Migration failed:', e);
        return {
          version: 5,
          records: {},
          macroTargets: { protein: 200, carbs: 300, fat: 80 },
          peptideProtocol: {
            retatrutida: { label: "Retatrutida", frequency: "weekly", weekday: 2 },
            bpc157_am: { label: "BPC-157 (mañana)", frequency: "daily" },
            bpc157_pm: { label: "BPC-157 (noche)", frequency: "daily" },
            cjc_ipa: { label: "CJC/Ipamorelin", frequency: "daily" },
            ghk_cu: { label: "GHK-Cu", frequency: "weekdays_only" },
            mots_c: { label: "MOTS-C", frequency: "3x_week", weekdays: [1,3,5] },
            nad: { label: "NAD+", frequency: "3x_week", weekdays: [1,3,5] },
            ta1: { label: "Thymosin Alpha-1", frequency: "2x_week", weekdays: [3,5] },
            ss31: { label: "SS-31", frequency: "daily" },
            klow: { label: "KLOW", frequency: "2x_week", weekdays: [3,5] },
            pt141: { label: "PT-141", frequency: "on_demand" },
            semax_selank: { label: "Semax+Selank", frequency: "2x_week", weekdays: [1,4] }
          },
          syncedAt: Date.now()
        };
      }
    }

    // ============================================================================
    // PEPTIDE DATA CONSTANTS
    // ============================================================================
    const PEPTIDE_DATA = {
      activos: [
        { id: "retatrutida", label: "Retatrutida", mechanism: "Triple agonista GLP-1/GIP/Glucagón, titulación conservadora", dosage_protocol: null, frequency: "weekly", weekday: 2 },
        { id: "bpc157_am", label: "BPC-157 (mañana)", mechanism: "Angiogénesis, curación tendones/ligamentos, repara mucosa GI", dosage_protocol: 50, frequency: "daily" },
        { id: "bpc157_pm", label: "BPC-157 (noche)", mechanism: "Angiogénesis, curación tendones/ligamentos, repara mucosa GI", dosage_protocol: 50, frequency: "daily" },
        { id: "cjc_ipa", label: "CJC/Ipamorelin", mechanism: "GH secretagogos sinérgicos, pulso GH fisiológico", dosage_protocol: 30, frequency: "daily" },
        { id: "ghk_cu", label: "GHK-Cu (independiente)", mechanism: "Síntesis colágeno tipo I/III, elastina, glicosaminoglicanos", dosage_protocol: 10, frequency: "weekdays_only" },
        { id: "mots_c", label: "MOTS-C", mechanism: "Regulador metabólico, activa AMPK, mejora sensibilidad insulina", dosage_protocol: 100, frequency: "3x_week", weekdays: [1,3,5] },
        { id: "nad", label: "NAD+", mechanism: "Coenzima metabólico mitocondrial, reparación ADN, activación sirtuinas", dosage_protocol: 100, frequency: "3x_week", weekdays: [1,3,5] },
        { id: "ta1", label: "Thymosin Alpha-1", mechanism: "Inmunomodulador, mejora función células T, aprobado clínico (Zadaxin)", dosage_protocol: 75, frequency: "2x_week", weekdays: [3,5] },
        { id: "ss31", label: "SS-31 (Elamipretide)", mechanism: "Protección mitocondrial, estabiliza cadena de electrones, reduce estrés oxidativo", dosage_protocol: null, frequency: "daily" },
        { id: "klow", label: "KLOW (sin GHK-Cu)", mechanism: "Blend: BPC-157/TB-500/KPV, reparación + antiinflamatorio vía NF-κB", dosage_protocol: 40, frequency: "2x_week", weekdays: [3,5] },
        { id: "pt141", label: "PT-141 (Bremelanotide)", mechanism: "Agonista melanocortina (MC3R/MC4R) central, deseo sexual", dosage_protocol: 10, frequency: "on_demand" },
        { id: "semax_selank", label: "Semax+Selank", mechanism: "Semax: BDNF stimulant; Selank: ansiolítico; administración nasal", dosage_protocol: 300, frequency: "2x_week", weekdays: [1,4] }
      ],
      opcionales: [
        { id: "opt_ara290", label: "⚪ ARA-290", mechanism: "Activador receptor reparación innata, dolor radicular", evidence: "Sin ensayos clínicos en dolor lumbar" },
        { id: "opt_cartalax", label: "⚪ Cartalax", mechanism: "Bioregulador ruso dirigido a cartílago discal", evidence: "Preclínico, sin ensayos humanos" },
        { id: "opt_pinealon", label: "⚪ Pinealon", mechanism: "Bioregulador cerebral, protección neuronal", evidence: "Preclínico" },
        { id: "opt_dsip", label: "⚪ DSIP", mechanism: "Delta Sleep-Inducing Peptide, sueño de ondas lentas", evidence: "Ensayos inconsistentes" },
        { id: "opt_slu", label: "⚪ SLU-PP-332", mechanism: "Agonista receptores ERR, mimetiza ejercicio aeróbico", evidence: "Solo evidencia animal" },
        { id: "opt_aod", label: "⚪ AOD9604", mechanism: "Fragmento HGH, lipólisis sin efecto en IGF-1", evidence: "Ensayo clínico: no superó placebo" },
        { id: "opt_oxy", label: "⚪ Oxytocin (SC)", mechanism: "Modulación bienestar/vínculo social vía SNC", evidence: "Evidencia débil vía SC" },
        { id: "opt_humanin", label: "⚪ Humanin", mechanism: "Péptido mitocondrial, mejora sensibilidad insulina", evidence: "Sin ensayos SC, mayoría cultivo/animal" },
        { id: "opt_foxo4", label: "⚪ FOXO4-DRI", mechanism: "Senolítico, apoptosis células senescentes", evidence: "Un estudio en ratones, cero humanos" }
      ]
    };

    // ============================================================================
    // REACT HOOKS & UTILITIES
    // ============================================================================
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    function getTodayKey() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return `${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]}`;
    }

    // ============================================================================
    // APP COMPONENT WITH TAB NAVIGATION (INCLUDING PEPTIDES)
    // ============================================================================
    function App() {
      const [data, setData] = useState(() => migrateLocalStorage());
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [selectedDate, setSelectedDate] = useState(getTodayKey());
      const [isDarkMode, setIsDarkMode] = useState(
        window.matchMedia('(prefers-color-scheme: dark)').matches
      );

      const saveData = useCallback((newData) => {
        setData(newData);
        try {
          localStorage.setItem('rb_tracker_v5', JSON.stringify(newData));
        } catch (e) {
          console.error('Save failed:', e);
        }
      }, []);

      const todayRecord = data.records[selectedDate] || {
        date: selectedDate,
        meals: [],
        workouts: [],
        supplements: { taken: [], notes: '' },
        hydration: { liters: 0, notes: '' },
        sleep: { hours: 0, quality: null, notes: '' },
        recovery: { soreness: null, hrv: null, notes: '' },
        peptides: [],
        checks: {}
      };

      const changeDate = (days) => {
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + days);
        setSelectedDate(d.toISOString().split('T')[0]);
      };

      return (
        <div style={{ minHeight: '100vh', background: isDarkMode ? '#111' : '#fff', color: isDarkMode ? '#fff' : '#000' }}>
          {/* Header */}
          <header style={{ background: '#102a43', color: '#fff', padding: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ textAlign: 'center', flex: 1 }}>
              <h1 style={{ fontSize: '18px', marginBottom: '8px' }}>{formatDate(selectedDate)}</h1>
              <div style={{ marginTop: '8px' }}>
                <button onClick={() => changeDate(-1)} style={{ background: '#1e5ba8', color: '#fff', border: 'none', padding: '6px 12px', marginRight: '8px', cursor: 'pointer', borderRadius: '4px' }}>← Anterior</button>
                <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} style={{ padding: '6px', margin: '0 8px', borderRadius: '4px', border: '1px solid #ccc' }} />
                <button onClick={() => changeDate(1)} style={{ background: '#1e5ba8', color: '#fff', border: 'none', padding: '6px 12px', marginLeft: '8px', cursor: 'pointer', borderRadius: '4px' }}>Siguiente →</button>
              </div>
            </div>
            <button
              onClick={() => setIsDarkMode(!isDarkMode)}
              style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer', fontSize: '20px' }}
              title="Toggle dark mode"
            >
              {isDarkMode ? '☀️' : '🌙'}
            </button>
          </header>

          {/* Tab Content */}
          <div style={{ padding: '16px', paddingBottom: '80px' }}>
            {currentTab === 'dashboard' && <DashboardTab todayRecord={todayRecord} data={data} />}
            {currentTab === 'meals' && <MealsTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'workouts' && <WorkoutsTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'recovery' && <RecoveryTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'hydration' && <HydrationTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'peptides' && <PeptidesTab todayRecord={todayRecord} saveData={saveData} data={data} isDarkMode={isDarkMode} />}
            {currentTab === 'historial' && <HistorialTab data={data} />}
            {currentTab === 'datos' && <DatosTab data={data} />}
          </div>

          {/* Tab Navigation */}
          <nav style={{ display: 'flex', gap: '2px', padding: '8px', background: isDarkMode ? '#222' : '#f5f5f5', position: 'fixed', bottom: 0, left: 0, right: 0, flexWrap: 'wrap', justifyContent: 'center' }}>
            {['dashboard', 'meals', 'workouts', 'recovery', 'hydration', 'peptides', 'historial', 'datos'].map((tab) => (
              <button
                key={tab}
                onClick={() => setCurrentTab(tab)}
                style={{
                  flex: '1 1 auto',
                  minWidth: '44px',
                  padding: '8px 4px',
                  background: currentTab === tab ? '#175cd3' : 'transparent',
                  color: currentTab === tab ? '#fff' : isDarkMode ? '#999' : '#667085',
                  border: 'none',
                  cursor: 'pointer',
                  fontWeight: currentTab === tab ? 'bold' : 'normal',
                  fontSize: '12px'
                }}
                title={tab}
              >
                {tab === 'dashboard' ? '📋' : tab === 'meals' ? '🍽️' : tab === 'workouts' ? '🏋️' : tab === 'recovery' ? '💪' : tab === 'hydration' ? '💧' : tab === 'peptides' ? '💉' : tab === 'historial' ? '📊' : '📁'}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    // ============================================================================
    // TAB COMPONENTS (Placeholders)
    // ============================================================================
    function DashboardTab({ todayRecord, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Dashboard — Coming soon</div>;
    }

    function MealsTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Meals tab — Coming soon</div>;
    }

    function WorkoutsTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Workouts tab — Coming soon</div>;
    }

    function RecoveryTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Recovery tab — Coming soon</div>;
    }

    function HydrationTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Hydration tab — Coming soon</div>;
    }

    function PeptidesTab({ todayRecord, saveData, data, isDarkMode }) {
      const [openSections, setOpenSections] = useState({
        diarios: true,
        threeWeek: true,
        segunDia: true,
        opcionales: false
      });

      const today = new Date();
      const dayOfWeek = today.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat

      // Helper: should peptide show today based on frequency?
      const shouldShowToday = (peptide) => {
        if (peptide.frequency === 'daily') return true;
        if (peptide.frequency === 'weekdays_only') return dayOfWeek >= 1 && dayOfWeek <= 5;
        if (peptide.frequency === '3x_week' && peptide.weekdays) return peptide.weekdays.includes(dayOfWeek);
        if (peptide.frequency === '2x_week' && peptide.weekdays) return peptide.weekdays.includes(dayOfWeek);
        if (peptide.frequency === 'weekly' && peptide.weekday) return dayOfWeek === peptide.weekday;
        if (peptide.frequency === 'on_demand') return true;
        return false;
      };

      // Categorize activos into sections
      const diarios = PEPTIDE_DATA.activos.filter(p => p.id.startsWith('bpc157') || p.id === 'cjc_ipa');
      const threeWeek = PEPTIDE_DATA.activos.filter(p => ['mots_c', 'nad', 'ta1', 'ghk_cu'].includes(p.id));
      const segunDia = PEPTIDE_DATA.activos.filter(p => ['retatrutida', 'klow', 'pt141', 'semax_selank', 'ss31'].includes(p.id));
      const opcionales = PEPTIDE_DATA.opcionales;

      const toggleSection = (section) => {
        setOpenSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const SectionHeader = ({ title, section }) => (
        <div
          onClick={() => toggleSection(section)}
          style={{
            cursor: 'pointer',
            minHeight: '44px',
            padding: '12px',
            background: isDarkMode ? '#252525' : '#f5f5f5',
            border: `1px solid ${isDarkMode ? '#333' : '#ddd'}`,
            color: isDarkMode ? '#e0e0e0' : '#333',
            borderRadius: '4px',
            marginBottom: '12px',
            fontWeight: 'bold',
            userSelect: 'none',
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center'
          }}
        >
          <span>{title}</span>
          <span>{openSections[section] ? '▼' : '▶'}</span>
        </div>
      );

      return (
        <div style={{ padding: '10px', maxWidth: '600px' }}>
          {/* Diarios */}
          <SectionHeader title="Diarios (cada día)" section="diarios" />
          {openSections.diarios && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #175cd3' }}>
              {diarios.length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No diarios</p>
              ) : (
                diarios.map(pep => (
                  <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} isDarkMode={isDarkMode} />
                ))
              )}
            </div>
          )}

          {/* 3x/Semana */}
          <SectionHeader title="3x/Semana" section="threeWeek" />
          {openSections.threeWeek && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #108a00' }}>
              {threeWeek.filter(shouldShowToday).length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No aplicable hoy</p>
              ) : (
                threeWeek.map(pep => (
                  shouldShowToday(pep) ? <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} isDarkMode={isDarkMode} /> : null
                ))
              )}
            </div>
          )}

          {/* Según Día */}
          <SectionHeader title="Según Día" section="segunDia" />
          {openSections.segunDia && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #f59e0b' }}>
              {segunDia.filter(shouldShowToday).length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No aplicable hoy</p>
              ) : (
                segunDia.map(pep => (
                  shouldShowToday(pep) ? <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} isDarkMode={isDarkMode} /> : null
                ))
              )}
            </div>
          )}

          {/* Opcionales */}
          <SectionHeader title="Opcionales — Evidencia Débil" section="opcionales" />
          {openSections.opcionales && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #999' }}>
              {opcionales.length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No opcionales</p>
              ) : (
                opcionales.map(pep => (
                  <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} isDarkMode={isDarkMode} />
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    function PeptideItem({ peptide, record, saveData, isDarkMode }) {
      return (
        <div style={{
          minHeight: '44px',
          padding: '12px',
          marginBottom: '8px',
          background: isDarkMode ? '#1a1a1a' : '#f9f9f9',
          border: `1px solid ${isDarkMode ? '#333' : '#ddd'}`,
          color: isDarkMode ? '#e0e0e0' : '#333',
          borderRadius: '4px',
          fontSize: '14px',
          display: 'flex',
          flexDirection: 'column',
          justifyContent: 'center'
        }}>
          <div style={{ fontWeight: 'bold', marginBottom: '4px' }}>{peptide.label}</div>
          <div style={{ fontSize: '12px', color: isDarkMode ? '#aaa' : '#666', marginBottom: '4px' }}>{peptide.mechanism}</div>
          {peptide.dosage_protocol && (
            <div style={{ fontSize: '12px', color: isDarkMode ? '#888' : '#999' }}>Dosis: {peptide.dosage_protocol}µg</div>
          )}
        </div>
      );
    }

    function HistorialTab({ data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Historial tab — Coming soon</div>;
    }

    function DatosTab({ data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Datos tab — Coming soon</div>;
    }

    // ============================================================================
    // MOUNT APP TO ROOT
    // ============================================================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
