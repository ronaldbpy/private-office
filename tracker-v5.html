<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>RB Tracker v5 - Elite Nutrition + Peptides</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    // ============================================================================
    // CORE MIGRATION FUNCTION
    // ============================================================================
    function migrateLocalStorage() {
      try {
        const v4Data = JSON.parse(localStorage.getItem('rb_tracker_v4') || '{"version":4,"records":{}}');

        if (v4Data.version === 5) {
          return v4Data;
        }

        const v5Data = {
          version: 5,
          records: {},
          macroTargets: {
            protein: 200,
            carbs: 300,
            fat: 80
          },
          peptideProtocol: {
            retatrutida: { label: "Retatrutida", frequency: "weekly", weekday: 2 },
            bpc157_am: { label: "BPC-157 (mañana)", frequency: "daily" },
            bpc157_pm: { label: "BPC-157 (noche)", frequency: "daily" },
            cjc_ipa: { label: "CJC/Ipamorelin", frequency: "daily" },
            ghk_cu: { label: "GHK-Cu", frequency: "weekdays_only" },
            mots_c: { label: "MOTS-C", frequency: "3x_week", weekdays: [1,3,5] },
            nad: { label: "NAD+", frequency: "3x_week", weekdays: [1,3,5] },
            ta1: { label: "Thymosin Alpha-1", frequency: "2x_week", weekdays: [3,5] },
            ss31: { label: "SS-31", frequency: "daily" },
            klow: { label: "KLOW", frequency: "2x_week", weekdays: [3,5] },
            pt141: { label: "PT-141", frequency: "on_demand" },
            semax_selank: { label: "Semax+Selank", frequency: "2x_week", weekdays: [1,4] }
          },
          syncedAt: Date.now()
        };

        Object.entries(v4Data.records || {}).forEach(([date, record]) => {
          v5Data.records[date] = {
            date,
            meals: [],
            workouts: [],
            supplements: { taken: [], notes: '' },
            hydration: { liters: 0, notes: '' },
            sleep: { hours: 0, quality: null, notes: '' },
            recovery: { soreness: null, hrv: null, notes: '' },
            peptides: [], // NEW: empty array for peptides
            checks: record.checks || {}
          };
        });

        localStorage.setItem('rb_tracker_v5', JSON.stringify(v5Data));
        return v5Data;
      } catch (e) {
        console.error('Migration failed:', e);
        return {
          version: 5,
          records: {},
          macroTargets: { protein: 200, carbs: 300, fat: 80 },
          peptideProtocol: {
            retatrutida: { label: "Retatrutida", frequency: "weekly", weekday: 2 },
            bpc157_am: { label: "BPC-157 (mañana)", frequency: "daily" },
            bpc157_pm: { label: "BPC-157 (noche)", frequency: "daily" },
            cjc_ipa: { label: "CJC/Ipamorelin", frequency: "daily" },
            ghk_cu: { label: "GHK-Cu", frequency: "weekdays_only" },
            mots_c: { label: "MOTS-C", frequency: "3x_week", weekdays: [1,3,5] },
            nad: { label: "NAD+", frequency: "3x_week", weekdays: [1,3,5] },
            ta1: { label: "Thymosin Alpha-1", frequency: "2x_week", weekdays: [3,5] },
            ss31: { label: "SS-31", frequency: "daily" },
            klow: { label: "KLOW", frequency: "2x_week", weekdays: [3,5] },
            pt141: { label: "PT-141", frequency: "on_demand" },
            semax_selank: { label: "Semax+Selank", frequency: "2x_week", weekdays: [1,4] }
          },
          syncedAt: Date.now()
        };
      }
    }

    // ============================================================================
    // PEPTIDE DATA CONSTANTS
    // ============================================================================
    const PEPTIDE_DATA = {
      activos: [
        { id: "retatrutida", label: "Retatrutida", mechanism: "Triple agonista GLP-1/GIP/Glucagón, titulación conservadora", dosage_protocol: null, frequency: "weekly", weekday: 2 },
        { id: "bpc157_am", label: "BPC-157 (mañana)", mechanism: "Angiogénesis, curación tendones/ligamentos, repara mucosa GI", dosage_protocol: 50, frequency: "daily" },
        { id: "bpc157_pm", label: "BPC-157 (noche)", mechanism: "Angiogénesis, curación tendones/ligamentos, repara mucosa GI", dosage_protocol: 50, frequency: "daily" },
        { id: "cjc_ipa", label: "CJC/Ipamorelin", mechanism: "GH secretagogos sinérgicos, pulso GH fisiológico", dosage_protocol: 30, frequency: "daily" },
        { id: "ghk_cu", label: "GHK-Cu (independiente)", mechanism: "Síntesis colágeno tipo I/III, elastina, glicosaminoglicanos", dosage_protocol: 10, frequency: "weekdays_only" },
        { id: "mots_c", label: "MOTS-C", mechanism: "Regulador metabólico, activa AMPK, mejora sensibilidad insulina", dosage_protocol: 100, frequency: "3x_week", weekdays: [1,3,5] },
        { id: "nad", label: "NAD+", mechanism: "Coenzima metabólico mitocondrial, reparación ADN, activación sirtuinas", dosage_protocol: 100, frequency: "3x_week", weekdays: [1,3,5] },
        { id: "ta1", label: "Thymosin Alpha-1", mechanism: "Inmunomodulador, mejora función células T, aprobado clínico (Zadaxin)", dosage_protocol: 75, frequency: "2x_week", weekdays: [3,5] },
        { id: "ss31", label: "SS-31 (Elamipretide)", mechanism: "Protección mitocondrial, estabiliza cadena de electrones, reduce estrés oxidativo", dosage_protocol: null, frequency: "daily" },
        { id: "klow", label: "KLOW (sin GHK-Cu)", mechanism: "Blend: BPC-157/TB-500/KPV, reparación + antiinflamatorio vía NF-κB", dosage_protocol: 40, frequency: "2x_week", weekdays: [3,5] },
        { id: "pt141", label: "PT-141 (Bremelanotide)", mechanism: "Agonista melanocortina (MC3R/MC4R) central, deseo sexual", dosage_protocol: 10, frequency: "on_demand" },
        { id: "semax_selank", label: "Semax+Selank", mechanism: "Semax: BDNF stimulant; Selank: ansiolítico; administración nasal", dosage_protocol: 300, frequency: "2x_week", weekdays: [1,4] }
      ],
      opcionales: [
        { id: "opt_ara290", label: "⚪ ARA-290", mechanism: "Activador receptor reparación innata, dolor radicular", evidence: "Sin ensayos clínicos en dolor lumbar" },
        { id: "opt_cartalax", label: "⚪ Cartalax", mechanism: "Bioregulador ruso dirigido a cartílago discal", evidence: "Preclínico, sin ensayos humanos" },
        { id: "opt_pinealon", label: "⚪ Pinealon", mechanism: "Bioregulador cerebral, protección neuronal", evidence: "Preclínico" },
        { id: "opt_dsip", label: "⚪ DSIP", mechanism: "Delta Sleep-Inducing Peptide, sueño de ondas lentas", evidence: "Ensayos inconsistentes" },
        { id: "opt_slu", label: "⚪ SLU-PP-332", mechanism: "Agonista receptores ERR, mimetiza ejercicio aeróbico", evidence: "Solo evidencia animal" },
        { id: "opt_aod", label: "⚪ AOD9604", mechanism: "Fragmento HGH, lipólisis sin efecto en IGF-1", evidence: "Ensayo clínico: no superó placebo" },
        { id: "opt_oxy", label: "⚪ Oxytocin (SC)", mechanism: "Modulación bienestar/vínculo social vía SNC", evidence: "Evidencia débil vía SC" },
        { id: "opt_humanin", label: "⚪ Humanin", mechanism: "Péptido mitocondrial, mejora sensibilidad insulina", evidence: "Sin ensayos SC, mayoría cultivo/animal" },
        { id: "opt_foxo4", label: "⚪ FOXO4-DRI", mechanism: "Senolítico, apoptosis células senescentes", evidence: "Un estudio en ratones, cero humanos" }
      ]
    };

    // ============================================================================
    // REACT HOOKS & UTILITIES
    // ============================================================================
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    function getTodayKey() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      return `${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]}`;
    }

    // ============================================================================
    // PROTOCOL VALIDATION FUNCTION (Task 7)
    // ============================================================================
    function validateProtocol(record, dayOfWeek) {
      const alerts = [];

      const peptides = record.peptides || [];
      const meals = record.meals || [];

      const pt141 = peptides.find(p => p.id === 'pt141' && p.status === 'done');
      const cjc = peptides.find(p => p.id === 'cjc_ipa' && p.status === 'done');
      const motsC = peptides.find(p => p.id === 'mots_c' && p.status === 'done');
      const ghkCu = peptides.find(p => p.id === 'ghk_cu');
      const retatrutida = peptides.find(p => p.id === 'retatrutida');

      // Validation 1: PT-141 + CJC same day (CRITICAL)
      if (pt141 && cjc) {
        alerts.push({
          peptideId: 'pt141',
          type: 'critical',
          message: '🔴 PT-141 no se aplica el mismo día que CJC/Ipamorelin'
        });
      }

      // Validation 2: MOTS-C requires fasting (WARNING)
      if (motsC && meals.length > 0) {
        alerts.push({
          peptideId: 'mots_c',
          type: 'warning',
          message: '⚠️ MOTS-C debe aplicarse en ayunas'
        });
      }

      // Validation 3: GHK-Cu weekdays only (CRITICAL on weekend)
      if (ghkCu && ghkCu.status !== 'pending' && (dayOfWeek === 0 || dayOfWeek === 6)) {
        alerts.push({
          peptideId: 'ghk_cu',
          type: 'critical',
          message: '🔴 GHK-Cu no se aplica sábado/domingo'
        });
      }

      // Validation 4: Retatrutida titration (WARNING if mismatch)
      if (retatrutida && retatrutida.status === 'done') {
        const weekNum = Math.floor((new Date(record.date).getDate() - 1) / 7) + 1;
        const expectedDose = weekNum <= 2 ? 2.5 : weekNum === 3 ? 5 : 10;
        if (Math.abs(retatrutida.dosage_applied - expectedDose) > 2) {
          alerts.push({
            peptideId: 'retatrutida',
            type: 'warning',
            message: `⚠️ Semana ${weekNum}: dosis esperada ${expectedDose}L, aplicada ${retatrutida.dosage_applied}L`
          });
        }
      }

      // Validation 5: CJC requires 2h fasting (WARNING if meal logged)
      if (cjc && meals.length > 0) {
        alerts.push({
          peptideId: 'cjc_ipa',
          type: 'warning',
          message: '⚠️ CJC/Ipamorelin requiere ≥2h de ayuno'
        });
      }

      return alerts;
    }

    // ============================================================================
    // APP COMPONENT WITH TAB NAVIGATION (INCLUDING PEPTIDES)
    // ============================================================================
    function App() {
      const [data, setData] = useState(() => migrateLocalStorage());
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [selectedDate, setSelectedDate] = useState(getTodayKey());
      const [isDarkMode, setIsDarkMode] = useState(
        window.matchMedia('(prefers-color-scheme: dark)').matches
      );

      const saveData = useCallback((newData) => {
        setData(newData);
        try {
          localStorage.setItem('rb_tracker_v5', JSON.stringify(newData));
        } catch (e) {
          console.error('Save failed:', e);
        }
      }, []);

      const todayRecord = useMemo(() => {
        if (!data.records[selectedDate]) {
          data.records[selectedDate] = {
            date: selectedDate,
            meals: [],
            workouts: [],
            supplements: { taken: [], notes: '' },
            hydration: { liters: 0, notes: '' },
            sleep: { hours: 0, quality: null, notes: '' },
            recovery: { soreness: null, hrv: null, notes: '' },
            peptides: [],
            checks: {}
          };
        }
        return data.records[selectedDate];
      }, [data, selectedDate]);

      const changeDate = (days) => {
        const d = new Date(selectedDate);
        d.setDate(d.getDate() + days);
        setSelectedDate(d.toISOString().split('T')[0]);
      };

      return (
        <div style={{ minHeight: '100vh', background: isDarkMode ? '#111' : '#fff', color: isDarkMode ? '#fff' : '#000' }}>
          {/* Header */}
          <header style={{ background: '#102a43', color: '#fff', padding: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ textAlign: 'center', flex: 1 }}>
              <h1 style={{ fontSize: '18px', marginBottom: '8px' }}>{formatDate(selectedDate)}</h1>
              <div style={{ marginTop: '8px' }}>
                <button onClick={() => changeDate(-1)} style={{ background: '#1e5ba8', color: '#fff', border: 'none', padding: '6px 12px', marginRight: '8px', cursor: 'pointer', borderRadius: '4px' }}>← Anterior</button>
                <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} style={{ padding: '6px', margin: '0 8px', borderRadius: '4px', border: '1px solid #ccc' }} />
                <button onClick={() => changeDate(1)} style={{ background: '#1e5ba8', color: '#fff', border: 'none', padding: '6px 12px', marginLeft: '8px', cursor: 'pointer', borderRadius: '4px' }}>Siguiente →</button>
              </div>
            </div>
            <button
              onClick={() => setIsDarkMode(!isDarkMode)}
              style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer', fontSize: '20px' }}
              title="Toggle dark mode"
            >
              {isDarkMode ? '☀️' : '🌙'}
            </button>
          </header>

          {/* Tab Content */}
          <div style={{ padding: '16px', paddingBottom: '80px' }}>
            {currentTab === 'dashboard' && <DashboardTab todayRecord={todayRecord} data={data} />}
            {currentTab === 'meals' && <MealsTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'workouts' && <WorkoutsTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'recovery' && <RecoveryTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'hydration' && <HydrationTab todayRecord={todayRecord} saveData={saveData} data={data} />}
            {currentTab === 'peptides' && <PeptidesTab todayRecord={todayRecord} saveData={saveData} data={data} isDarkMode={isDarkMode} />}
            {currentTab === 'historial' && <HistorialTab data={data} />}
            {currentTab === 'datos' && <DatosTab data={data} />}
          </div>

          {/* Tab Navigation */}
          <nav style={{ display: 'flex', gap: '2px', padding: '8px', background: isDarkMode ? '#222' : '#f5f5f5', position: 'fixed', bottom: 0, left: 0, right: 0, flexWrap: 'wrap', justifyContent: 'center' }}>
            {['dashboard', 'meals', 'workouts', 'recovery', 'hydration', 'peptides', 'historial', 'datos'].map((tab) => (
              <button
                key={tab}
                onClick={() => setCurrentTab(tab)}
                style={{
                  flex: '1 1 auto',
                  minWidth: '44px',
                  padding: '8px 4px',
                  background: currentTab === tab ? '#175cd3' : 'transparent',
                  color: currentTab === tab ? '#fff' : isDarkMode ? '#999' : '#667085',
                  border: 'none',
                  cursor: 'pointer',
                  fontWeight: currentTab === tab ? 'bold' : 'normal',
                  fontSize: '12px'
                }}
                title={tab}
              >
                {tab === 'dashboard' ? '📋' : tab === 'meals' ? '🍽️' : tab === 'workouts' ? '🏋️' : tab === 'recovery' ? '💪' : tab === 'hydration' ? '💧' : tab === 'peptides' ? '💉' : tab === 'historial' ? '📊' : '📁'}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    // ============================================================================
    // TAB COMPONENTS (Placeholders)
    // ============================================================================
    function DashboardTab({ todayRecord, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Dashboard — Coming soon</div>;
    }

    function MealsTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Meals tab — Coming soon</div>;
    }

    function WorkoutsTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Workouts tab — Coming soon</div>;
    }

    function RecoveryTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Recovery tab — Coming soon</div>;
    }

    function HydrationTab({ todayRecord, saveData, data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Hydration tab — Coming soon</div>;
    }

    function PeptidesTab({ todayRecord, saveData, data, isDarkMode }) {
      const [openSections, setOpenSections] = useState({
        diarios: true,
        threeWeek: true,
        segunDia: true,
        opcionales: false
      });

      const today = new Date();
      const dayOfWeek = today.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat

      // Validate protocol and get alerts (Task 7)
      const alerts = useMemo(() => validateProtocol(todayRecord, dayOfWeek), [todayRecord, dayOfWeek]);

      // Helper: should peptide show today based on frequency?
      const shouldShowToday = (peptide) => {
        if (peptide.frequency === 'daily') return true;
        if (peptide.frequency === 'weekdays_only') return dayOfWeek >= 1 && dayOfWeek <= 5;
        if (peptide.frequency === '3x_week' && peptide.weekdays) return peptide.weekdays.includes(dayOfWeek);
        if (peptide.frequency === '2x_week' && peptide.weekdays) return peptide.weekdays.includes(dayOfWeek);
        if (peptide.frequency === 'weekly' && peptide.weekday) return dayOfWeek === peptide.weekday;
        if (peptide.frequency === 'on_demand') return true;
        return false;
      };

      // Categorize activos into sections
      const diarios = PEPTIDE_DATA.activos.filter(p => p.id.startsWith('bpc157') || p.id === 'cjc_ipa');
      const threeWeek = PEPTIDE_DATA.activos.filter(p => ['mots_c', 'nad', 'ta1', 'ghk_cu'].includes(p.id));
      const segunDia = PEPTIDE_DATA.activos.filter(p => ['retatrutida', 'klow', 'pt141', 'semax_selank', 'ss31'].includes(p.id));
      const opcionales = PEPTIDE_DATA.opcionales;

      const toggleSection = (section) => {
        setOpenSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const SectionHeader = ({ title, section }) => (
        <div
          onClick={() => toggleSection(section)}
          style={{
            cursor: 'pointer',
            minHeight: '44px',
            padding: '12px',
            background: isDarkMode ? '#252525' : '#f5f5f5',
            border: `1px solid ${isDarkMode ? '#333' : '#ddd'}`,
            color: isDarkMode ? '#e0e0e0' : '#333',
            borderRadius: '4px',
            marginBottom: '12px',
            fontWeight: 'bold',
            userSelect: 'none',
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center'
          }}
        >
          <span>{title}</span>
          <span>{openSections[section] ? '▼' : '▶'}</span>
        </div>
      );

      return (
        <div style={{ padding: '10px', maxWidth: '600px' }}>
          {/* Diarios */}
          <SectionHeader title="Diarios (cada día)" section="diarios" />
          {openSections.diarios && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #175cd3' }}>
              {diarios.length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No diarios</p>
              ) : (
                diarios.map(pep => (
                  <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} data={data} isDarkMode={isDarkMode} alerts={alerts} />
                ))
              )}
            </div>
          )}

          {/* 3x/Semana */}
          <SectionHeader title="3x/Semana" section="threeWeek" />
          {openSections.threeWeek && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #108a00' }}>
              {threeWeek.filter(shouldShowToday).length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No aplicable hoy</p>
              ) : (
                threeWeek.map(pep => (
                  shouldShowToday(pep) ? <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} data={data} isDarkMode={isDarkMode} alerts={alerts} /> : null
                ))
              )}
            </div>
          )}

          {/* Según Día */}
          <SectionHeader title="Según Día" section="segunDia" />
          {openSections.segunDia && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #f59e0b' }}>
              {segunDia.filter(shouldShowToday).length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No aplicable hoy</p>
              ) : (
                segunDia.map(pep => (
                  shouldShowToday(pep) ? <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} data={data} isDarkMode={isDarkMode} alerts={alerts} /> : null
                ))
              )}
            </div>
          )}

          {/* Opcionales */}
          <SectionHeader title="Opcionales — Evidencia Débil" section="opcionales" />
          {openSections.opcionales && (
            <div style={{ marginBottom: '20px', paddingLeft: '10px', borderLeft: '3px solid #999' }}>
              {opcionales.length === 0 ? (
                <p style={{ color: isDarkMode ? '#666' : '#999' }}>No opcionales</p>
              ) : (
                opcionales.map(pep => (
                  <PeptideItem key={pep.id} peptide={pep} record={todayRecord} saveData={saveData} data={data} isDarkMode={isDarkMode} alerts={alerts} />
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // DOSAGE MODAL COMPONENT
    // ============================================================================
    function DosageModal({ peptide, entry, onSave, onClose, isDarkMode }) {
      const [dosage, setDosage] = useState(entry.dosage_applied || peptide.dosage_protocol || 50);
      const [notes, setNotes] = useState(entry.notes || '');

      const handleSave = () => {
        entry.dosage_applied = dosage;
        entry.notes = notes;
        onSave();
        onClose();
      };

      return (
        <div style={{
          position: 'fixed',
          top: 0,
          left: 0,
          right: 0,
          bottom: 0,
          backgroundColor: 'rgba(0,0,0,0.5)',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 1000
        }}>
          <div style={{
            backgroundColor: isDarkMode ? '#1a1a1a' : '#fff',
            padding: '20px',
            borderRadius: '8px',
            minWidth: '300px',
            maxWidth: '500px',
            boxShadow: '0 4px 6px rgba(0,0,0,0.1)',
            color: isDarkMode ? '#e0e0e0' : '#333'
          }}>
            <h3 style={{ marginBottom: '15px', color: isDarkMode ? '#e0e0e0' : '#333' }}>{entry.label}</h3>
            <div style={{ marginBottom: '15px' }}>
              <label style={{ color: isDarkMode ? '#bbb' : '#666' }}>Dosis (L1-L100):</label><br />
              <input
                type="number"
                min="1"
                max="100"
                value={dosage}
                onChange={(e) => setDosage(parseInt(e.target.value) || 50)}
                style={{
                  width: '100%',
                  padding: '8px',
                  marginTop: '5px',
                  fontSize: '16px',
                  borderRadius: '4px',
                  border: `1px solid ${isDarkMode ? '#444' : '#ccc'}`,
                  backgroundColor: isDarkMode ? '#2a2a2a' : '#fff',
                  color: isDarkMode ? '#e0e0e0' : '#333',
                  boxSizing: 'border-box'
                }}
              />
            </div>
            <div style={{ marginBottom: '15px' }}>
              <label style={{ color: isDarkMode ? '#bbb' : '#666' }}>Notas (max 200 chars):</label><br />
              <textarea
                value={notes}
                onChange={(e) => setNotes(e.target.value.slice(0, 200))}
                maxLength="200"
                style={{
                  width: '100%',
                  padding: '8px',
                  marginTop: '5px',
                  fontSize: '14px',
                  minHeight: '80px',
                  borderRadius: '4px',
                  border: `1px solid ${isDarkMode ? '#444' : '#ccc'}`,
                  backgroundColor: isDarkMode ? '#2a2a2a' : '#fff',
                  color: isDarkMode ? '#e0e0e0' : '#333',
                  boxSizing: 'border-box',
                  fontFamily: 'inherit'
                }}
                placeholder="Observaciones, sitio de inyección, etc"
              />
              <div style={{ fontSize: '12px', color: isDarkMode ? '#999' : '#999', marginTop: '4px' }}>{notes.length}/200</div>
            </div>
            <div style={{ display: 'flex', gap: '10px', justifyContent: 'flex-end' }}>
              <button
                onClick={onClose}
                style={{
                  padding: '8px 16px',
                  cursor: 'pointer',
                  backgroundColor: isDarkMode ? '#444' : '#ccc',
                  color: isDarkMode ? '#e0e0e0' : '#333',
                  border: 'none',
                  borderRadius: '4px',
                  fontSize: '14px',
                  fontWeight: 'bold'
                }}
              >
                Cancelar
              </button>
              <button
                onClick={handleSave}
                style={{
                  padding: '8px 16px',
                  cursor: 'pointer',
                  backgroundColor: '#2ecc71',
                  color: 'white',
                  border: 'none',
                  borderRadius: '4px',
                  fontSize: '14px',
                  fontWeight: 'bold'
                }}
              >
                Guardar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function PeptideItem({ peptide, record, saveData, data, isDarkMode, alerts = [] }) {
      // Initialize state for this peptide entry
      const [entry, setEntry] = useState(() => {
        if (!record.peptides) record.peptides = [];
        const existing = record.peptides.find(p => p.id === peptide.id);
        if (existing) return existing;

        const newEntry = {
          id: peptide.id,
          label: peptide.label,
          mechanism: peptide.mechanism,
          dosage_protocol: peptide.dosage_protocol,
          dosage_applied: peptide.dosage_protocol || 50,
          status: 'pending',
          timestamp: null,
          notes: ''
        };
        record.peptides.push(newEntry);
        return newEntry;
      });

      const [showModal, setShowModal] = useState(false);

      // Filter alerts for this peptide (Task 7)
      const peptideAlerts = alerts.filter(a => a.peptideId === peptide.id);

      const handleStatusClick = () => {
        const states = ['pending', 'done', 'skipped'];
        const current = entry.status || 'pending';
        const nextIdx = (states.indexOf(current) + 1) % 3;
        const updatedEntry = { ...entry, status: states[nextIdx], timestamp: states[nextIdx] === 'done' ? new Date().toISOString() : null };
        setEntry(updatedEntry);

        // Update in record and save
        const idx = record.peptides.findIndex(p => p.id === peptide.id);
        if (idx !== -1) record.peptides[idx] = updatedEntry;
        saveData(data);
      };

      const handleDosageChange = (e) => {
        const value = e.target.value;
        const dosage = value ? parseInt(value) : (peptide.dosage_protocol || 50);
        const updatedEntry = { ...entry, dosage_applied: dosage };
        setEntry(updatedEntry);

        // Update in record and save
        const idx = record.peptides.findIndex(p => p.id === peptide.id);
        if (idx !== -1) record.peptides[idx] = updatedEntry;
        saveData(data);
      };

      const handleModalSave = () => {
        const idx = record.peptides.findIndex(p => p.id === peptide.id);
        if (idx !== -1) record.peptides[idx] = entry;
        saveData(data);
      };

      const statusSymbol = entry.status === 'done' ? '☑' : entry.status === 'skipped' ? '⊘' : '☐';
      const statusColor = entry.status === 'done' ? '#2ecc71' : entry.status === 'skipped' ? '#95a5a6' : '#f39c12';
      const statusLabel = entry.status.charAt(0).toUpperCase() + entry.status.slice(1);

      return (
        <>
          {/* Render protocol alerts (Task 7) */}
          {peptideAlerts.map((alert, idx) => (
            <div
              key={idx}
              style={{
                padding: '10px',
                marginBottom: '8px',
                borderRadius: '4px',
                backgroundColor: alert.type === 'critical'
                  ? (isDarkMode ? '#8b0000' : '#ffcccc')
                  : (isDarkMode ? '#856404' : '#fff3cd'),
                borderLeft: `4px solid ${alert.type === 'critical' ? '#cc0000' : '#ff9800'}`,
                color: alert.type === 'critical'
                  ? (isDarkMode ? '#ffcccc' : '#8b0000')
                  : (isDarkMode ? '#fff3cd' : '#856404'),
                fontSize: '13px',
                fontWeight: '500'
              }}
            >
              {alert.message}
            </div>
          ))}

          <div style={{
            border: `1px solid ${isDarkMode ? '#333' : '#ddd'}`,
            padding: '10px',
            marginBottom: '10px',
            borderRadius: '4px',
            backgroundColor: isDarkMode ? '#1a1a1a' : '#f9f9f9'
          }}>
            <div style={{ fontWeight: 'bold', marginBottom: '4px', color: isDarkMode ? '#e0e0e0' : '#333' }}>{entry.label}</div>
            <div style={{ fontSize: '12px', color: isDarkMode ? '#999' : '#666', marginBottom: '8px' }}>
              🧬 {entry.mechanism}
            </div>
            <div style={{
              display: 'flex',
              alignItems: 'center',
              gap: '10px',
              marginTop: '8px',
              minHeight: '44px',
              flexWrap: 'wrap'
            }}>
              <input
                type="number"
                min="1"
                max="100"
                value={entry.dosage_applied}
                onChange={handleDosageChange}
                style={{
                  width: '60px',
                  minWidth: '44px',
                  padding: '6px',
                  fontSize: '14px',
                  borderRadius: '4px',
                  border: `1px solid ${isDarkMode ? '#444' : '#ccc'}`,
                  backgroundColor: isDarkMode ? '#2a2a2a' : '#fff',
                  color: isDarkMode ? '#e0e0e0' : '#333'
                }}
                placeholder="L"
              />
              <span style={{ color: isDarkMode ? '#aaa' : '#666' }}>L</span>
              <button
                onClick={handleStatusClick}
                style={{
                  padding: '6px 12px',
                  cursor: 'pointer',
                  backgroundColor: statusColor,
                  color: 'white',
                  border: 'none',
                  borderRadius: '4px',
                  fontSize: '14px',
                  minWidth: '44px',
                  minHeight: '44px',
                  fontWeight: 'bold',
                  transition: 'background-color 0.2s'
                }}
                title={`Status: ${statusLabel}`}
              >
                {statusSymbol} {statusLabel}
              </button>
              <button
                onClick={() => setShowModal(true)}
                style={{
                  padding: '6px 12px',
                  cursor: 'pointer',
                  backgroundColor: '#3498db',
                  color: 'white',
                  border: 'none',
                  borderRadius: '4px',
                  fontSize: '14px',
                  minHeight: '44px',
                  fontWeight: 'bold',
                  transition: 'background-color 0.2s'
                }}
                title="Editar dosificación y notas"
              >
                Editar
              </button>
            </div>
          </div>
          {showModal && (
            <DosageModal
              peptide={peptide}
              entry={entry}
              onSave={handleModalSave}
              onClose={() => setShowModal(false)}
              isDarkMode={isDarkMode}
            />
          )}
        </>
      );
    }

    function HistorialTab({ data }) {
      const getPeptideHistory = () => {
        const history = [];
        for (let i = 0; i < 7; i++) {
          const date = new Date();
          date.setDate(date.getDate() - i);
          const dateStr = date.toISOString().split('T')[0];
          const record = data.records[dateStr] || {};
          const peptides = record.peptides || [];
          peptides.forEach(p => {
            history.push({
              date: dateStr,
              peptide: p.label,
              dosage: p.dosage_applied ? `L${p.dosage_applied}` : '—',
              status: p.status,
              time: p.timestamp ? new Date(p.timestamp).toLocaleTimeString('es-ES') : '—'
            });
          });
        }
        return history;
      };

      const peptideHistory = getPeptideHistory();

      const getStatusSymbol = (status) => {
        if (status === 'done') return '✓';
        if (status === 'skipped') return '⊘';
        return '?';
      };

      const getStatusColor = (status) => {
        if (status === 'done') return '#2ecc71';
        if (status === 'skipped') return '#95a5a6';
        return '#f39c12';
      };

      return (
        <div style={{ padding: '16px' }}>
          <h3 style={{ marginBottom: '20px', fontSize: '16px', fontWeight: 'bold' }}>Péptidos — Últimos 7 días</h3>

          {peptideHistory.length === 0 ? (
            <div style={{ padding: '20px', textAlign: 'center', color: '#999' }}>
              No hay registros de péptidos en los últimos 7 días
            </div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px' }}>
                <thead>
                  <tr style={{ backgroundColor: '#f0f0f0', borderBottom: '2px solid #ddd' }}>
                    <th style={{ border: '1px solid #ddd', padding: '8px', textAlign: 'left' }}>Fecha</th>
                    <th style={{ border: '1px solid #ddd', padding: '8px', textAlign: 'left' }}>Péptido</th>
                    <th style={{ border: '1px solid #ddd', padding: '8px', textAlign: 'left' }}>Dosis</th>
                    <th style={{ border: '1px solid #ddd', padding: '8px', textAlign: 'left' }}>Estado</th>
                    <th style={{ border: '1px solid #ddd', padding: '8px', textAlign: 'left' }}>Hora</th>
                  </tr>
                </thead>
                <tbody>
                  {peptideHistory.map((row, idx) => (
                    <tr key={idx} style={{ borderBottom: '1px solid #eee' }}>
                      <td style={{ border: '1px solid #ddd', padding: '8px' }}>{row.date}</td>
                      <td style={{ border: '1px solid #ddd', padding: '8px' }}>{row.peptide}</td>
                      <td style={{ border: '1px solid #ddd', padding: '8px' }}>{row.dosage}</td>
                      <td style={{
                        border: '1px solid #ddd',
                        padding: '8px',
                        color: getStatusColor(row.status),
                        fontWeight: 'bold'
                      }}>
                        {getStatusSymbol(row.status)} {row.status}
                      </td>
                      <td style={{ border: '1px solid #ddd', padding: '8px' }}>{row.time}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function DatosTab({ data }) {
      return <div style={{ padding: '16px', textAlign: 'center' }}>Datos tab — Coming soon</div>;
    }

    // ============================================================================
    // MOUNT APP TO ROOT
    // ============================================================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
