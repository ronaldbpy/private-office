<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>RB Tracker v5 - Elite Nutrition + Peptides</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    header {
      background: #102a43;
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    header h1 { font-size: 18px; margin-bottom: 12px; }
    .controls { display: flex; gap: 8px; justify-content: center; align-items: center; }
    .controls input { padding: 8px; font-size: 14px; }
    .controls button { padding: 8px 16px; background: #175cd3; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .controls button:hover { background: #1047a0; }
    .dark-toggle { position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 20px; cursor: pointer; }
    main { flex: 1; overflow-y: auto; padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .section { margin-bottom: 16px; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
    .section-header { background: #252525; padding: 12px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .section-header:hover { background: #2a2a2a; }
    .section-body { padding: 12px; display: none; }
    .section-body.open { display: block; }
    .peptide-item { background: #1a1a1a; border: 1px solid #333; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
    .peptide-name { font-weight: bold; margin-bottom: 4px; }
    .peptide-mechanism { font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .peptide-controls { display: flex; gap: 8px; align-items: center; }
    .peptide-controls input { width: 60px; padding: 6px; }
    .peptide-controls .dosage-unit { margin-left: -4px; }
    .status-btn { padding: 6px 12px; background: #f39c12; color: black; border: none; cursor: pointer; border-radius: 3px; font-size: 12px; }
    .status-btn.done { background: #2ecc71; color: white; }
    .status-btn.skipped { background: #95a5a6; color: white; }
    .edit-btn { padding: 6px 12px; background: #175cd3; color: white; border: none; cursor: pointer; border-radius: 3px; font-size: 12px; }
    nav { display: flex; gap: 8px; padding: 8px; background: #102a43; border-top: 1px solid #333; flex-wrap: wrap; justify-content: center; }
    nav button { padding: 10px; flex: 1; min-width: 60px; background: #1a1a1a; color: #e0e0e0; border: 1px solid #333; cursor: pointer; border-radius: 4px; }
    nav button.active { background: #175cd3; color: white; }
    nav button:hover { background: #252525; }
    .placeholder { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <div id="root">
    <header>
      <button class="dark-toggle" onclick="toggleDarkMode()">☀️</button>
      <h1 id="dateDisplay">Jueves, 6 de agosto</h1>
      <div class="controls">
        <button onclick="previousDay()">← Anterior</button>
        <input type="date" id="dateInput" onchange="setDate(this.value)">
        <button onclick="nextDay()">Siguiente →</button>
      </div>
    </header>

    <main id="content">
      <!-- Tabs will be generated here -->
    </main>

    <nav id="tabs">
      <!-- Tab buttons will be generated here -->
    </nav>
  </div>

  <script>
    // ============================================================================
    // DATA & STATE
    // ============================================================================
    let currentTab = 'dashboard';
    let isDarkMode = true;
    let data = null;
    let todayRecord = null;

    const PEPTIDE_DATA = {
      activos: [
        { id: 'bpc157_am', label: 'BPC-157 (mañana)', mechanism: '🧬 Angiogénesis, curación tendones/ligamentos, repara mucosa GI', dosage_protocol: 50, frequency: 'daily' },
        { id: 'bpc157_pm', label: 'BPC-157 (noche)', mechanism: '🧬 Angiogénesis, curación tendones/ligamentos, repara mucosa GI', dosage_protocol: 50, frequency: 'daily' },
        { id: 'cjc_ipa', label: 'CJC/Ipamorelin', mechanism: '🧬 GH secretagogos sinérgicos, pulso GH fisiológico', dosage_protocol: 30, frequency: 'daily' },
        { id: 'ghk_cu', label: 'GHK-Cu (independiente)', mechanism: '🧬 Síntesis colágeno tipo I/III, elastina, glicosaminoglicanos', dosage_protocol: 50, frequency: 'weekdays_only' },
        { id: 'mots_c', label: 'MOTS-C', mechanism: '🧬 Regulador metabólico, activa AMPK, mejora sensibilidad insulina', dosage_protocol: 50, frequency: '3x_week' },
        { id: 'nad', label: 'NAD+', mechanism: '🧬 Coenzima metabólico mitocondrial, reparación ADN, activación sirtuinas', dosage_protocol: 50, frequency: '3x_week' },
        { id: 'ta1', label: 'Thymosin Alpha-1', mechanism: '🧬 Inmunomodulador, mejora función células T, aprobado clínico (Zadaxin)', dosage_protocol: 50, frequency: '2x_week' },
        { id: 'ss31', label: 'SS-31 (Elamipretide)', mechanism: '🧬 Protección mitocondrial, estabiliza cadena de electrones, reduce estrés oxidativo', dosage_protocol: 50, frequency: 'daily' },
        { id: 'klow', label: 'KLOW (sin GHK-Cu)', mechanism: '🧬 Blend: BPC-157/TB-500/KPV, reparación + antiinflamatorio vía NF-κB', dosage_protocol: 50, frequency: '2x_week' },
        { id: 'pt141', label: 'PT-141 (Bremelanotide)', mechanism: '🧬 Agonista melanocortina (MC3R/MC4R) central, deseo sexual', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'retatrutida', label: 'Retatrutida', mechanism: '🧬 Triple agonista GLP-1/GIP/Glucagón, titulación conservadora', dosage_protocol: 50, frequency: 'weekly' },
        { id: 'semax_selank', label: 'Semax+Selank', mechanism: '🧬 Neuropéptidos cognitivos, estrés, neuroplasticidad', dosage_protocol: 50, frequency: '2x_week' }
      ],
      opcionales: [
        { id: 'ara290', label: 'ARA-290', mechanism: '🧬 Agonista receptor innata', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'cartalax', label: 'Cartalax', mechanism: '🧬 Cartílago/tendón', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'pinealon', label: 'Pinealon', mechanism: '🧬 Pineal, sueño', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'dsip', label: 'DSIP', mechanism: '🧬 Péptido sueño delta', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'slupp332', label: 'SLU-PP-332', mechanism: '🧬 Neuroprotección', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'aod9604', label: 'AOD9604', mechanism: '🧬 Lipolítico', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'oxytocin', label: 'Oxytocina (SC)', mechanism: '🧬 Enlace social', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'humanin', label: 'Humanin', mechanism: '🧬 Mitocondrial', dosage_protocol: 50, frequency: 'on_demand' },
        { id: 'foxo4_dri', label: 'FOXO4-DRI', mechanism: '🧬 Senolítico', dosage_protocol: 50, frequency: 'on_demand' }
      ]
    };

    // ============================================================================
    // INITIALIZATION
    // ============================================================================
    function init() {
      loadData();
      render();
      setTodayDate();
    }

    function loadData() {
      let stored = localStorage.getItem('rb_tracker_v5');

      if (!stored) {
        // Check for v4 data and migrate
        const v4Data = JSON.parse(localStorage.getItem('rb_tracker_v4') || null);
        if (v4Data && v4Data.records) {
          // Migrate v4 → v5
          data = {
            version: 5,
            records: {},
            macroTargets: v4Data.macroTargets || { protein: 200, carbs: 300, fat: 80 },
            syncedAt: Date.now()
          };

          Object.entries(v4Data.records).forEach(([date, record]) => {
            data.records[date] = {
              date: record.date || date,
              meals: record.meals || [],
              workouts: record.workouts || [],
              supplements: record.supplements || { taken: [], notes: '' },
              hydration: record.hydration || { liters: 0, notes: '' },
              sleep: record.sleep || { hours: 0, quality: null, notes: '' },
              recovery: record.recovery || { soreness: null, hrv: null, notes: '' },
              peptides: [],
              checks: record.checks || {}
            };
          });

          localStorage.setItem('rb_tracker_v5', JSON.stringify(data));
          console.log('✓ Migrated v4 data to v5 with ' + Object.keys(data.records).length + ' days');
        } else {
          // Fresh start
          data = {
            version: 5,
            records: {},
            macroTargets: { protein: 200, carbs: 300, fat: 80 },
            syncedAt: Date.now()
          };
        }
      } else {
        data = JSON.parse(stored);
      }
      updateTodayRecord();
    }

    function saveData() {
      localStorage.setItem('rb_tracker_v5', JSON.stringify(data));
    }

    function updateTodayRecord() {
      const today = document.getElementById('dateInput').value || getTodayDateString();
      if (!data.records[today]) {
        data.records[today] = {
          date: today,
          meals: [],
          workouts: [],
          supplements: { taken: [], notes: '' },
          hydration: { liters: 0, notes: '' },
          sleep: { hours: 0, quality: null, notes: '' },
          recovery: { soreness: null, hrv: null, notes: '' },
          peptides: [],
          checks: {}
        };
      }
      todayRecord = data.records[today];
    }

    function getTodayDateString() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function setTodayDate() {
      const today = getTodayDateString();
      document.getElementById('dateInput').value = today;
      updateTodayRecord();
      updateDateDisplay();
    }

    function updateDateDisplay() {
      const dateStr = document.getElementById('dateInput').value;
      const date = new Date(dateStr + 'T00:00:00');
      const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const months = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const dayName = days[date.getDay()];
      const monthName = months[date.getMonth()];
      document.getElementById('dateDisplay').textContent = `${dayName}, ${date.getDate()} de ${monthName}`;
    }

    function previousDay() {
      const input = document.getElementById('dateInput');
      const date = new Date(input.value);
      date.setDate(date.getDate() - 1);
      input.value = date.toISOString().split('T')[0];
      updateTodayRecord();
      updateDateDisplay();
      render();
    }

    function nextDay() {
      const input = document.getElementById('dateInput');
      const date = new Date(input.value);
      date.setDate(date.getDate() + 1);
      input.value = date.toISOString().split('T')[0];
      updateTodayRecord();
      updateDateDisplay();
      render();
    }

    function setDate(value) {
      updateTodayRecord();
      updateDateDisplay();
      render();
    }

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      document.body.style.background = isDarkMode ? '#1a1a1a' : '#f5f5f5';
      document.body.style.color = isDarkMode ? '#e0e0e0' : '#333';
      render();
    }

    // ============================================================================
    // RENDERING
    // ============================================================================
    function render() {
      renderTabs();
      renderContent();
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';
      const tabs = ['dashboard', 'meals', 'workouts', 'recovery', 'hydration', 'peptides', 'historial', 'datos'];
      const emojis = { dashboard: '📋', meals: '🍽️', workouts: '💪', recovery: '😴', hydration: '💧', peptides: '💉', historial: '📊', datos: '📁' };

      tabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.textContent = emojis[tab];
        btn.title = tab;
        if (tab === currentTab) btn.classList.add('active');
        btn.onclick = () => switchTab(tab);
        tabsContainer.appendChild(btn);
      });
    }

    function renderContent() {
      const content = document.getElementById('content');
      if (currentTab === 'peptides') {
        content.innerHTML = renderPeptidesTab();
      } else if (currentTab === 'dashboard') {
        content.innerHTML = '<div class="placeholder">Dashboard — Coming soon</div>';
      } else {
        content.innerHTML = `<div class="placeholder">${currentTab} tab — Coming soon</div>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      render();
    }

    function renderPeptidesTab() {
      // Pre-populate peptides if needed
      [...PEPTIDE_DATA.activos, ...PEPTIDE_DATA.opcionales].forEach(pep => {
        if (!todayRecord.peptides.find(p => p.id === pep.id)) {
          todayRecord.peptides.push({
            id: pep.id,
            label: pep.label,
            mechanism: pep.mechanism,
            dosage_protocol: pep.dosage_protocol,
            dosage_applied: pep.dosage_protocol || 50,
            status: 'pending',
            timestamp: null
          });
        }
      });
      saveData();

      let html = '';

      // Diarios
      const diarios = PEPTIDE_DATA.activos.filter(p => p.frequency === 'daily');
      html += '<div class="section"><div class="section-header" onclick="toggleSection(this)">Diarios (cada día) <span>▼</span></div><div class="section-body open">';
      diarios.forEach(pep => html += renderPeptideItem(pep));
      html += '</div></div>';

      // 3x/Semana
      const threeWeek = PEPTIDE_DATA.activos.filter(p => ['3x_week', '2x_week', 'weekdays_only'].includes(p.frequency));
      html += '<div class="section"><div class="section-header" onclick="toggleSection(this)">3x/Semana <span>▼</span></div><div class="section-body open">';
      threeWeek.forEach(pep => html += renderPeptideItem(pep));
      html += '</div></div>';

      // Según Día
      const segunDia = PEPTIDE_DATA.activos.filter(p => p.frequency === 'weekly' || p.frequency === 'on_demand');
      html += '<div class="section"><div class="section-header" onclick="toggleSection(this)">Según Día <span>▼</span></div><div class="section-body open">';
      segunDia.forEach(pep => html += renderPeptideItem(pep));
      html += '</div></div>';

      // Opcionales
      html += '<div class="section"><div class="section-header" onclick="toggleSection(this)">Opcionales — Evidencia Débil <span>▶</span></div><div class="section-body">';
      PEPTIDE_DATA.opcionales.forEach(pep => html += renderPeptideItem(pep));
      html += '</div></div>';

      return html;
    }

    function renderPeptideItem(peptide) {
      let entry = todayRecord.peptides.find(p => p.id === peptide.id);
      if (!entry) {
        entry = { id: peptide.id, label: peptide.label, mechanism: peptide.mechanism, dosage_protocol: peptide.dosage_protocol, dosage_applied: peptide.dosage_protocol || 50, status: 'pending', timestamp: null };
        todayRecord.peptides.push(entry);
        saveData();
      }

      const statusClass = entry.status === 'done' ? 'done' : entry.status === 'skipped' ? 'skipped' : '';
      const statusText = entry.status === 'done' ? 'Done' : entry.status === 'skipped' ? 'Skipped' : 'Pending';

      return `
        <div class="peptide-item">
          <div class="peptide-name">${entry.label}</div>
          <div class="peptide-mechanism">${entry.mechanism}</div>
          <div class="peptide-controls">
            <input type="number" min="1" max="100" value="${entry.dosage_applied}" onchange="updateDosage('${entry.id}', this.value)">
            <span class="dosage-unit">L</span>
            <button class="status-btn ${statusClass}" onclick="toggleStatus('${entry.id}')" title="Status: ${statusText}">○ ${statusText}</button>
            <button class="edit-btn" onclick="editPeptide('${entry.id}')">Editar</button>
          </div>
        </div>
      `;
    }

    function toggleSection(header) {
      const body = header.nextElementSibling;
      body.classList.toggle('open');
      const arrow = header.querySelector('span');
      arrow.textContent = body.classList.contains('open') ? '▼' : '▶';
    }

    function updateDosage(id, value) {
      const entry = todayRecord.peptides.find(p => p.id === id);
      if (entry) {
        entry.dosage_applied = parseInt(value) || 50;
        saveData();
      }
    }

    function toggleStatus(id) {
      const entry = todayRecord.peptides.find(p => p.id === id);
      if (entry) {
        const states = ['pending', 'done', 'skipped'];
        const idx = states.indexOf(entry.status);
        entry.status = states[(idx + 1) % 3];
        entry.timestamp = entry.status === 'done' ? new Date().toISOString() : null;
        saveData();
        render();
      }
    }

    function editPeptide(id) {
      alert('Edit modal coming soon for peptide: ' + id);
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
